<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>အားကစား - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between gap-2">
      
      <!-- Logo & Brand -->
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <img src="photo_2026-09-07_21-25-15.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-sm md:text-base font-bold tracking-wide">စာပေဥယျာဥ်</h1>
      </a>

      <!-- search bar and Live Clock -->
      
      <div class="bg-indigo-950/60 border border-indigo-800 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
        <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
        <span id="dateDisplay" class="font-medium">00/00/0000</span>
      </div>

      <!-- Mobile Menu Button -->
      <button id="menuToggleBtn" class="text-amber-400 text-lg p-1 focus:outline-none">
        <i class="fa-solid fa-bars" id="menuIcon"></i>
      </button>
    </div>

    <!-- Mobile Dropdown Menu Box (အောက်သို့ သီးသန့် ကျလာမည့် Box) -->
    <div id="mobileMenu" class="hidden bg-indigo-950 border-t border-indigo-800 px-4 py-3 shadow-xl">
      <nav class="flex flex-col space-y-2 text-sm">
        <a href="index.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-house text-amber-400"></i> ပင်မစာမျက်နှာ
        </a>
        <a href="newnovels.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-book text-amber-400"></i> ဝတ္ထုစင်
        </a>
        <a href="knowledges.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-lightbulb text-amber-400"></i> သုတရသ
        </a>
        <a href="sports.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-football text-amber-400"></i> အားကစား
        </a>
        <a href="poems.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-feather text-amber-400"></i> ကဗျာ
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto my-6 px-4 flex-grow max-w-4xl">
    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-gray-100 mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
          <span class="p-2 bg-amber-100 text-amber-800 rounded-lg text-sm"><i class="fa-solid fa-trophy"></i></span>
          အားကစား ဆောင်းပါးများနှင့် သတင်းများ
        </h2>
        <p class="text-xs text-gray-500 mt-1">နောက်ဆုံးရ အားကစား သတင်းများနှင့် ဆောင်းပါးများ</p>
      </div>
      <a href="submit.html" class="hidden sm:inline-flex items-center gap-1.5 bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-3.5 py-2 rounded-lg font-bold transition">
        <i class="fa-solid fa-pen-to-square"></i> စာမူတင်ရန်
      </a>
    </div>

    <div id="sportsPostsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-10 text-gray-400 text-xs">
        <i class="fa-solid fa-spinner fa-spin text-lg mr-2"></i> စာမူများကို ရယူနေပါသည်...
      </div>
    </div>
  </main>

  <!-- Detail Modal Popup -->
  <div id="postModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div id="modalContent" class="w-full flex justify-center"></div>
  </div>

  <footer class="bg-indigo-950 text-indigo-200 py-4 text-center text-xs mt-10">
    <p>© 2026 စာပေဥယျာဉ်. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const postsContainer = document.getElementById('sportsPostsContainer');

    // Navigation Logic
    const menuBtn = document.getElementById('menuBtn');
    const menuList = document.getElementById('menuList');
    const menuIcon = document.getElementById('menuIcon');

    if (menuBtn && menuList && menuIcon) {
      menuBtn.onclick = () => {
        menuList.classList.toggle('hidden');
        menuIcon.className = menuList.classList.contains('hidden') ? "fa-solid fa-bars" : "fa-solid fa-xmark";
      };
    }

    let sportsPosts = [];

    // Fetch Sports Posts
    onValue(ref(database, 'sports'), (snapshot) => {
      const data = snapshot.val();
      postsContainer.innerHTML = '';
      sportsPosts = [];

      if (!data) {
        postsContainer.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs">အားကစား စာမူများ မရှိသေးပါ။</div>`;
        return;
      }

      Object.entries(data).forEach(([key, val]) => {
        sportsPosts.push({
          id: key,
          title: val.title || 'ခေါင်းစဉ်မရှိ',
          author: val.author || 'မသိရပါ',
          content: val.content || '',
          date: val.date || '',
          image: val.image || val.imageUrl || val.img || '',
          comments: val.comments || {},
          likes: val.likes || 0,
          views: val.views || 0
        });
      });

      sportsPosts.sort((a, b) => b.id.localeCompare(a.id));

      sportsPosts.forEach(post => {
        const imageMarkup = post.image 
          ? `<img src="${post.image}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0 border border-gray-100" />`
          : `<div class="w-20 h-20 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 flex-shrink-0 border border-amber-100"><i class="fa-solid fa-newspaper text-xl"></i></div>`;

        postsContainer.innerHTML += `
          <div onclick="openModal('${post.id}')" class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:border-amber-200 transition cursor-pointer flex gap-3.5 items-center">
            ${imageMarkup}
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded">အားကစား</span>
                <span class="text-[11px] text-gray-400">${post.date}</span>
              </div>
              <h3 class="text-xs font-bold text-gray-800 truncate mb-1">
                ${post.title}
              </h3>
              <p class="text-[11px] text-gray-500 truncate mb-1">
                ${post.content}
              </p>
              <div class="flex items-center justify-between mt-1">
                <span class="text-[10px] text-indigo-600 font-semibold">ရေးသားသူ - ${post.author}</span>
                <div class="flex items-center gap-2 text-[10px] text-gray-400">
                  <span>👁️ ${post.views}</span>
                  <span>❤️ ${post.likes}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    });

    // Open Modal with Comment Box
    window.openModal = function(postId) {
      const post = sportsPosts.find(p => p.id === postId);
      if (!post) return;

      // Views အရေအတွက် တိုးရန်
      const postRef = ref(database, `sports/${postId}`);
      runTransaction(postRef, (p) => {
        if (p) {
          p.views = (p.views || 0) + 1;
        }
        return p;
      });

      const modalContainer = document.getElementById('postModal');
      const modalContent = document.getElementById('modalContent');

      const imageHtml = post.image 
        ? `<div class="mb-3 overflow-hidden rounded-xl border border-gray-100 shadow-sm">
             <img src="${post.image}" class="max-h-52 mx-auto object-contain rounded-lg" alt="Post">
           </div>`
        : '';

      // Comments list rendering
      let commentsHtml = '';
      if (post.comments && Object.keys(post.comments).length > 0) {
        Object.values(post.comments).forEach(c => {
          commentsHtml += `
            <div class="bg-gray-100/70 p-2.5 rounded-lg text-xs space-y-0.5">
              <div class="flex justify-between font-bold text-indigo-950 text-[11px]">
                <span>${c.name || 'ဧည့်သည်'}</span>
                <span class="text-gray-400 text-[10px] font-normal">${c.date || ''}</span>
              </div>
              <p class="text-gray-700">${c.text}</p>
            </div>
          `;
        });
      } else {
        commentsHtml = `<p class="text-[11px] text-gray-400 text-center py-2">မှတ်ချက်များ မရှိသေးပါ။</p>`;
      }

      modalContent.innerHTML = `
          <div class="bg-white rounded-2xl max-w-5xl w-full h-[90vh] flex flex-col overflow-hidden">
          
          <!-- Header -->
          <div class="bg-indigo-50/70 px-4 py-3 border-b border-indigo-100 flex justify-between items-start flex-shrink-0">
            <div class="pr-2">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded">အားကစား</span>
                <span class="text-[11px] text-gray-500 font-medium">ရေးသားသူ - ${post.author}</span>
                <span class="text-[11px] text-gray-400">• ${post.date}</span>
              </div>
              <h2 class="text-sm md:text-base font-bold text-gray-800 leading-snug">${post.title}</h2>
              
              <!-- Likes & Views Section -->
              <div class="flex items-center gap-4 text-xs text-gray-500 mt-2">
                <span>👁️ <span id="viewCount">${(post.views || 0) + 1}</span> ကြည့်ရှုသူ</span>
                <button onclick="likePost('${post.id}')" class="flex items-center gap-1 hover:text-red-500 text-red-600 font-semibold transition bg-red-50 px-2 py-0.5 rounded-full border border-red-100">
                  ❤️ <span id="likeCount">${post.likes || 0}</span> သဘောကျသည်
                </button>
              </div>
            </div>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-lg p-1 transition flex-shrink-0">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Body Content + Comments -->
          <div class="p-4 md:p-5 overflow-y-auto max-h-[70vh] space-y-4">
            ${imageHtml}
            <div class="bg-gray-50/70 p-4 rounded-xl border border-gray-100 text-xs md:text-sm text-gray-700 leading-relaxed space-y-3">
              <p class="whitespace-pre-line">${post.content}</p>
            </div>

            <!-- Comment Box Section -->
            <div class="border-t border-gray-100 pt-3 space-y-3">
              <h4 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                <i class="fa-regular fa-comments text-indigo-600"></i> မှတ်ချက်များ
              </h4>

              <!-- Comment Input Form -->
              <div class="space-y-2 bg-indigo-50/40 p-3 rounded-xl border border-indigo-50">
                <input type="text" id="commentName" placeholder="သင့်နာမည် ရေးပါ..." class="w-full text-xs p-2 rounded-lg border border-gray-200 outline-none focus:ring-1 focus:ring-indigo-500">
                <textarea id="commentText" rows="2" placeholder="မှတ်ချက် ရေးရန်..." class="w-full text-xs p-2 rounded-lg border border-gray-200 outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                <button onclick="addComment('${post.id}')" class="bg-indigo-900 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold hover:bg-indigo-800 transition float-right">
                  မှတ်ချက် ပို့မည်
                </button>
                <div class="clear-both"></div>
              </div>

              <!-- Comment Display Area -->
              <div class="space-y-2 mt-2">
                ${commentsHtml}
              </div>
            </div>

          </div>

          <!-- Footer -->
          <div class="px-4 py-2.5 bg-gray-50 border-t border-gray-100 flex justify-end flex-shrink-0">
            <button onclick="closeModal()" class="bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-5 py-2 rounded-lg font-bold transition">
              ပိတ်မည်
            </button>
          </div>

        </div>
      `;

      modalContainer.classList.remove('hidden');
      modalContainer.classList.add('flex');
    };

    // Add Comment Function
    window.addComment = async function(postId) {
      const nameInput = document.getElementById('commentName');
      const textInput = document.getElementById('commentText');

      if (!textInput.value.trim()) {
        alert("မှတ်ချက် စာသား ရေးပေးပါ!");
        return;
      }

      const commentData = {
        name: nameInput.value.trim() || 'ဧည့်သည်',
        text: textInput.value.trim(),
        date: new Date().toLocaleDateString('en-GB')
      };

      try {
        await push(ref(database, `sports/${postId}/comments`), commentData);
        alert("မှတ်ချက် တင်ပြီးပါပြီ!");
        closeModal();
      } catch (err) {
        alert("မှတ်ချက် တင်၍ မရပါ: " + err.message);
      }
    };

    // Close Modal Function
    window.closeModal = function() {
      const modalContainer = document.getElementById('postModal');
      if (modalContainer) {
        modalContainer.classList.add('hidden');
        modalContainer.classList.remove('flex');
      }
    };

    // Like Function
    window.likePost = async function(postId) {
      try {
        const postRef = ref(database, `sports/${postId}`);
        await runTransaction(postRef, (post) => {
          if (post) {
            post.likes = (post.likes || 0) + 1;
          }
          return post;
        });

        const likeElem = document.getElementById('likeCount');
        if (likeElem) {
          likeElem.textContent = parseInt(likeElem.textContent || 0) + 1;
        }
      } catch (err) {
        console.error("Like ပေး၍ မရပါ: ", err);
      }
    };
    document.getElementById('menuToggleBtn').addEventListener('click', () => {
      const mobileMenu = document.getElementById('mobileMenu');
      const menuIcon = document.getElementById('menuIcon');
    
      mobileMenu.classList.toggle('hidden');
      menuIcon.classList.toggle('fa-bars');
      menuIcon.classList.toggle('fa-xmark');
    });
  </script>
</body>
</html>
