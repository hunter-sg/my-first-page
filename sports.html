<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>နိုင်ငံတကာ အားကစားသတင်းများ - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Padauk', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-indigo-900 text-white py-1.5 px-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex flex-wrap justify-between items-center gap-2">
      <h1 class="text-lg font-bold tracking-wide">စာပေဥယျာဉ်</h1>
      <div class="flex items-center space-x-2.5 text-xs flex-wrap">
        <a href="index.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
        </a>
        <a href="index.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-book-open"></i> အထွေထွေသုတရသများ
        </a>
        <a href="novels.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-book"></i> ဝတ္ထုတို/ရှည်များ
        </a>
        <a href="sports.html" class="text-amber-400 font-bold flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-futbol"></i> နိုင်ငံတကာ အားကစားသတင်းများ
        </a>
        <a href="poems.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-feather"></i> ကဗျာများ
        </a>
        <a href="submit.html" class="bg-amber-500 hover:bg-amber-600 text-black px-3 py-1 rounded-full font-bold transition shadow-sm flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-plus"></i> စာမူသစ်တင်ရန်
        </a>
      </div>
    </div>
  </nav>

  <!-- Header Section -->
  <header class="bg-indigo-800 text-white py-8 px-4 text-center shadow-inner">
    <h2 class="text-2xl md:text-3xl font-bold mb-2">
      <i class="fa-solid fa-trophy text-amber-400 mr-2"></i>နိုင်ငံတကာ အားကစားသတင်းများ
    </h2>
    <p class="text-gray-200 text-sm">ကမ္ဘာတစ်ဝှမ်းမှ အားကစားသတင်းနှင့် သုံးသပ်ချက်များ</p>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto my-8 px-4 flex-grow">
    <div id="sportsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-gray-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-600"></i>
        <p>သတင်းများကို ရယူနေပါသည်...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-indigo-950 text-gray-400 py-4 text-center text-xs mt-auto">
    <p>© 2026 စာပေဥယျာဉ်။ မူပိုင်ခွင့်များအားလုံး လက်ဝယ်ရှိသည်။</p>
  </footer>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const container = document.getElementById('sportsContainer');
    const sportsRef = ref(database, 'sports');

    onValue(sportsRef, (snapshot) => {
      container.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.values(data).reverse().forEach((item) => {
          container.innerHTML += `
            <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-3">
                  <span class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-bold">
                    <i class="fa-solid fa-futbol mr-1"></i> အားကစားသတင်း
                  </span>
                  <span class="text-xs text-gray-400">${item.date || ''}</span>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">${item.title}</h3>
                <p class="text-xs text-indigo-600 font-semibold mb-4">သတင်းထောက် - ${item.author}</p>
                <p class="text-gray-600 text-sm whitespace-pre-line leading-relaxed">${item.content}</p>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-lg border border-dashed border-gray-300">
            <i class="fa-solid fa-newspaper text-gray-300 text-5xl mb-3"></i>
            <p class="text-gray-500">တင်ထားသော အားကစားသတင်းများ မရှိသေးပါ။</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
