<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-book-bookmark text-amber-400"></i> စာပေဥယျာဥ်
    </a>
    <div class="flex items-center gap-2">
      <a id="prevPageBtn" href="newnovels.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition flex items-center gap-1.5 border border-indigo-700/50">
        <i class="fa-solid fa-arrow-left"></i> Prev Page
      </a>
      <a href="index.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition flex items-center gap-1.5">
        <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
      </a>
    </div>
  </header>

  <main class="container mx-auto max-w-5xl px-4 py-8 flex-grow">
    
    <!-- Novel Details Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      
      <!-- Top Title Tag -->
      <div class="text-amber-600 font-bold text-sm uppercase flex items-center gap-2 border-b border-gray-100 pb-3 mb-6">
        <i class="fa-solid fa-circle-info"></i> <span id="headerNovelTitle">...</span>
      </div>

      <!-- Main Overview Grid -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- Left Side: Cover & Meta Details -->
        <div class="md:col-span-4 flex flex-col items-center md:items-start">
          <div class="w-48 h-64 bg-gray-200 rounded-lg overflow-hidden shadow-md border border-gray-200 mb-4">
            <img id="novelCover" src="" alt="Cover" class="w-full h-full object-cover hidden" onload="this.classList.remove('hidden')">
          </div>
          
          <div class="w-full space-y-2 text-xs md:text-sm text-gray-600 border-t md:border-t-0 pt-3 md:pt-0">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-user text-gray-500 w-4"></i> <span id="novelAuthor">...</span>
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-list text-gray-500 w-4"></i> <span id="novelCategory">ဝတ္ထု</span>
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-globe text-gray-500 w-4"></i> <span>Webnovel</span>
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-clock text-gray-500 w-4"></i> <span id="novelStatus" class="text-emerald-600 font-medium">Completed</span>
            </div>
          </div>
        </div>

        <!-- Right Side: Title, Rating, Summary & Action Buttons -->
        <div class="md:col-span-8 flex flex-col">
          <h1 id="novelTitle" class="text-2xl md:text-3xl font-extrabold text-gray-900 tracking-wide uppercase mb-2">...</h1>
          
          <!-- Rating Section -->
          <div class="flex items-center gap-1 text-amber-400 text-sm mb-4">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-regular fa-star"></i>
            <span class="text-xs text-gray-500 ml-2 font-medium">4.3 / 5 ( 1424 votes )</span>
          </div>

          <!-- Summary -->
          <div class="mb-6 flex-grow">
            <h3 class="text-xs font-bold text-gray-800 uppercase tracking-wider mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-circle-info text-amber-500"></i> SUMMARY
            </h3>
            <p id="novelSummary" class="text-xs md:text-sm text-gray-600 leading-relaxed whitespace-pre-line">
              ...
            </p>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-wrap gap-3 justify-end border-t border-gray-100 pt-4">
            <a href="#chapterListSection" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded text-xs md:text-sm flex items-center gap-2 shadow-sm transition">
              <i class="fa-solid fa-list-ul"></i> CHAPTER LIST
            </a>
            <a id="readFirstBtn" href="#" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded text-xs md:text-sm flex items-center gap-2 shadow-sm transition">
              <i class="fa-solid fa-circle-arrow-right"></i> READ FIRST
            </a>
          </div>

        </div>
      </div>

      <!-- Latest Chapters Section -->
      <div class="mt-10 border-t border-gray-200 pt-6">
        <h2 class="text-amber-600 font-extrabold text-sm uppercase flex items-center gap-2 mb-4">
          <i class="fa-solid fa-pen-to-square"></i> LATEST CHAPTERS
        </h2>
        <div id="latestChaptersList" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2 text-xs md:text-sm">
          <div class="text-gray-400 py-2">ရယူနေပါသည်...</div>
        </div>
      </div>

      <!-- All Chapters Section -->
      <div id="chapterListSection" class="mt-8 border-t border-gray-200 pt-6">
        <h2 class="text-amber-600 font-extrabold text-sm uppercase flex items-center gap-2 mb-4">
          <i class="fa-solid fa-list-ul"></i> CHAPTER LIST
        </h2>
        <div id="chapterList" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2 text-xs md:text-sm">
          <div class="text-gray-400 py-2">ရယူနေပါသည်...</div>
        </div>
      </div>

    </div>

  </main>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category') || 'newnovels';
    const currentId = urlParams.get('id');

    document.getElementById('prevPageBtn').href = `${category}.html`;

    function getBaseTitle(fullTitle) {
      if (!fullTitle) return '';
      let clean = fullTitle.trim();
      if (clean.toLowerCase().includes('shadow slave')) return 'shadow slave';
      if (clean.includes('ကောင်းကင်ဘုံကို')) return 'ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်';
      return clean.split(/::|-|\.\.|chapter/i)[0].trim().toLowerCase();
    }

    async function loadNovelDetails() {
      if (!currentId) return;

      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, category));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const currentPost = data[currentId];

          if (currentPost) {
            const rawTitle = currentPost.title || '';
            const targetBaseName = getBaseTitle(rawTitle);

            let mainBookTitle = rawTitle.split(/::|-|\.\.|chapter/i)[0].trim() || rawTitle;

            // Matching keys ရှာဖွေခြင်း
            const allKeys = Object.keys(data);
            const filteredKeys = allKeys.filter(key => getBaseTitle(data[key].title) === targetBaseName);

            // ၁။ ပုံ (Image) ကို ရှာဖွေဖော်ပြခြင်း
            let coverUrl = currentPost.image || currentPost.imageUrl || currentPost.img || '';
            
            // လက်ရှိ post မှာ ပုံမပါရင် ဒီဝတ္ထုရဲ့ အခြား အခန်းတွေမှာ ပုံပါသလား ရှာမည်
            if (!coverUrl && filteredKeys.length > 0) {
              for (let k of filteredKeys) {
                const imgFound = data[k].image || data[k].imageUrl || data[k].img;
                if (imgFound) {
                  coverUrl = imgFound;
                  break;
                }
              }
            }

            const coverImgEl = document.getElementById('novelCover');
            if (coverUrl) {
              coverImgEl.src = coverUrl;
              coverImgEl.classList.remove('hidden');
            } else {
              // ပုံလုံးဝမရှိပါက Placeholder ပုံ ပြပေးရန်
              coverImgEl.src = 'https://via.placeholder.com/200x260?text=No+Cover';
              coverImgEl.classList.remove('hidden');
            }

            // ၂။ Summary ကို ရှာဖွေဖော်ပြခြင်း
            let summaryText = currentPost.summary || currentPost.description || '';
            
            if (!summaryText && filteredKeys.length > 0) {
              for (let k of filteredKeys) {
                if (data[k].summary || data[k].description) {
                  summaryText = data[k].summary || data[k].description;
                  break;
                }
              }
            }

            // Summary မရှိသေးပါက Content အစပိုင်း စာလုံး ၂၀၀ ကိုဖြတ်ပြီး Summary အဖြစ်သုံးမည်
            if (!summaryText) {
              const mainContent = currentPost.content || '';
              summaryText = mainContent.length > 200 ? mainContent.substring(0, 200) + '...' : mainContent;
            }

            // UI ပေါ်သို့ အချက်အလက်များ တပ်ဆင်ခြင်း
            document.getElementById('headerNovelTitle').textContent = mainBookTitle;
            document.getElementById('novelTitle').textContent = mainBookTitle;
            document.getElementById('novelAuthor').textContent = currentPost.author || 'translate by Hunter';
            document.getElementById('novelSummary').textContent = summaryText || 'အကြောင်းအရာ ဖော်ပြချက် မရှိသေးပါ။';

            // Read First Button Link set
            if (filteredKeys.length > 0) {
              document.getElementById('readFirstBtn').href = `read.html?category=${category}&id=${filteredKeys[0]}`;
            }

            // Render Chapter Item Helper
            const createChapterElement = (key) => {
              const item = data[key];
              const chapterTitle = item.title || key;

              const link = document.createElement('a');
              link.href = `read.html?category=${category}&id=${key}`;
              link.className = 'flex items-center gap-2 py-2 px-1 text-gray-700 hover:text-amber-600 border-b border-dashed border-gray-200 transition truncate';
              link.innerHTML = `
                <i class="fa-solid fa-book text-gray-800 text-xs flex-shrink-0"></i>
                <span class="truncate">${chapterTitle}</span>
              `;
              return link;
            };

            // Chapter List
            const chapterListEl = document.getElementById('chapterList');
            chapterListEl.innerHTML = '';
            filteredKeys.forEach(key => {
              chapterListEl.appendChild(createChapterElement(key));
            });

            // Latest Chapters List (နောက်ဆုံး ထွက်ထားသော အခန်း ၆ ခန်း)
            const latestListEl = document.getElementById('latestChaptersList');
            latestListEl.innerHTML = '';
            const latestKeys = [...filteredKeys].reverse().slice(0, 6);
            
            latestKeys.forEach(key => {
              latestListEl.appendChild(createChapterElement(key));
            });

          }
        }
      } catch (err) {
        console.error("Novel Details Error:", err);
      }
    }

    loadNovelDetails();
  </script>
</body>
</html>
