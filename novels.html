<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Details - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <!-- Header Section -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-book-bookmark text-amber-400"></i> စာပေဥယျာဥ်
    </a>
    <a href="index.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition">
      <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
    </a>
  </header>

  <main class="container mx-auto max-w-4xl my-6 px-4">
    
    <!-- Novel Details Card Box -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
      <!-- Top Banner -->
      <div class="h-32 bg-slate-800 relative">
        <div class="absolute -bottom-10 left-6">
          <img id="novelCover" src="" class="w-24 h-32 object-cover rounded-lg shadow-md border-2 border-white bg-gray-200">
        </div>
      </div>

      <!-- Info Area -->
      <div class="pt-12 p-6">
        <h1 id="novelTitle" class="text-xl md:text-2xl font-bold text-gray-900 mb-2">Loading...</h1>
        
        <div class="flex flex-wrap gap-4 text-xs text-gray-600 mb-4 border-b border-gray-100 pb-4">
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-user text-indigo-600"></i> <span id="novelAuthor"></span></span>
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-tags text-indigo-600"></i> <span id="novelCategory">ဝတ္ထု</span></span>
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-clock text-indigo-600"></i> Ongoing</span>
        </div>

        <div class="mb-6">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1">
            <i class="fa-solid fa-circle-info text-amber-500"></i> SUMMARY
          </h3>
          <p id="novelSummary" class="text-xs md:text-sm text-gray-600 leading-relaxed bg-gray-50 p-3.5 rounded-xl border border-gray-100"></p>
        </div>

        <div class="flex gap-3">
          <a id="readFirstBtn" href="#" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-sm transition">
            <i class="fa-solid fa-circle-play"></i> READ FIRST
          </a>
        </div>
      </div>
    </div>

    <!-- Chapter List Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2 border-b border-gray-100 pb-3">
        <i class="fa-solid fa-list text-amber-500"></i> CHAPTER LIST
      </h2>

      <!-- Chapter Grid (၂ တိုင်ပြိုင်) -->
      <div id="chapterListGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="col-span-full text-center py-6 text-gray-400 text-xs">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i> အခန်းများကို ရယူနေပါသည်...
        </div>
      </div>
    </div>

  </main>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category') || 'newnovels';

    async function loadNovel() {
      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, category));
        const grid = document.getElementById('chapterListGrid');
        grid.innerHTML = '';

        if (snapshot.exists()) {
          const data = snapshot.val();
          const keys = Object.keys(data);

          if (keys.length > 0) {
            const firstPost = data[keys[0]];

            // Header Info ပြင်ဆင်ခြင်း
            document.getElementById('novelTitle').textContent = firstPost.title ? firstPost.title.split('-')[0] : 'အိမ်မက် စကြာဝဠာ လမ်းစဉ်';
            document.getElementById('novelAuthor').textContent = firstPost.author || 'translate by Hunter';
            document.getElementById('novelCover').src = firstPost.image || 'photo_2026-09-07_21-25-15.jpg';
            document.getElementById('novelSummary').textContent = firstPost.content ? firstPost.content.substring(0, 250) + '...' : 'အကြောင်းအရာ မရှိသေးပါ။';

            // READ FIRST ခလုတ်နှိပ်ပါက ပထမဆုံးအခန်း (read.html) သို့ သွားရန်
            const readFirstBtn = document.getElementById('readFirstBtn');
            readFirstBtn.href = `read.html?category=${category}&id=${keys[0]}`;

            // Chapter များအားလုံးကို Grid အဖြစ်ထုတ်ပေးခြင်း
            keys.forEach((key, index) => {
              const post = data[key];
              const chapBox = document.createElement('div');
              chapBox.className = "p-3 bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-200 rounded-xl flex items-center justify-between text-xs cursor-pointer transition";
              chapBox.innerHTML = `
                <span class="font-semibold text-gray-700 truncate">
                  <i class="fa-regular fa-file-lines text-indigo-600 mr-2"></i>${post.title || `Chapter ${index + 1}`}
                </span>
                <span class="text-[10px] text-gray-400 flex-shrink-0">${post.date || ''}</span>
              `;
              
              // အခန်းတစ်ခုခုကို နှိပ်လိုက်ပါက သက်ဆိုင်ရာ read.html သို့ သွားရန်
              chapBox.onclick = () => {
                window.location.href = `read.html?category=${category}&id=${key}`;
              };
              
              grid.appendChild(chapBox);
            });
          }
        } else {
          grid.innerHTML = '<p class="text-xs text-gray-400 col-span-full text-center">မည်သည့် အခန်းမှ မရှိသေးပါ။</p>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadNovel();
  </script>
</body>
</html>
