<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Details - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-book-bookmark text-amber-400"></i> စာပေဥယျာဥ်
    </a>
    
    <!-- Header ညာဘက်ရှိ Buttons များ (Prev Page ခလုတ်ကို ဘယ်ဘက်တွင် ထည့်ပေးထားသည်) -->
    <div class="flex items-center gap-2">
      <a id="prevPageBtn" href="newnovels.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition flex items-center gap-1.5 border border-indigo-700/50">
        <i class="fa-solid fa-arrow-left"></i> Prev Page
      </a>
      <a href="index.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition flex items-center gap-1.5">
        <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
      </a>
    </div>
  </header>

  <!-- Banner Background -->
  <div class="bg-slate-800 h-32 md:h-44 w-full"></div>

  <main class="container mx-auto max-w-4xl px-4 flex-grow -mt-16 md:-mt-24 mb-12">
    
    <!-- Novel Info Card Box -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 relative">

      <!-- Novel Header Section (Cover + Titles) -->
      <div class="flex flex-col md:flex-row gap-6 items-start">
        <!-- Cover Image -->
        <div class="w-28 h-40 md:w-36 md:h-52 flex-shrink-0 bg-gray-200 rounded-xl overflow-hidden shadow-md border border-gray-200">
          <img id="novelCover" src="" alt="Cover" class="w-full h-full object-cover hidden" onload="this.classList.remove('hidden')">
        </div>

        <!-- Novel Details -->
        <div class="flex-grow">
          <h1 id="novelTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-3">...</h1>
          
          <div class="flex flex-wrap items-center gap-4 text-xs md:text-sm text-gray-600 mb-4">
            <span class="flex items-center gap-1.5 text-indigo-600 font-medium">
              <i class="fa-solid fa-user"></i> <span id="novelAuthor">...</span>
            </span>
            <span class="flex items-center gap-1.5 text-amber-600 font-medium">
              <i class="fa-solid fa-tag"></i> <span id="novelCategory">ဝတ္ထု</span>
            </span>
            <span class="flex items-center gap-1.5 text-emerald-600 font-medium">
              <i class="fa-solid fa-clock"></i> <span id="novelStatus">Ongoing</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Summary Section -->
      <div class="mt-8">
        <h3 class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-info"></i> SUMMARY
        </h3>
        <div id="novelSummary" class="bg-gray-50 border border-gray-100 rounded-xl p-4 text-xs md:text-sm text-gray-600 leading-relaxed space-y-2 whitespace-pre-line">
          ...
        </div>
      </div>

      <!-- Chapters List Section -->
      <div class="mt-8">
        <h3 class="text-sm font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2">
          <i class="fa-solid fa-list-ul text-indigo-600"></i> အခန်းများ (Chapters)
        </h3>
        <div id="chapterList" class="space-y-2">
          <div class="text-center py-6 text-gray-400">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> ရယူနေပါသည်...
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category') || 'newnovels';
    const currentId = urlParams.get('id');

    // Prev Page Button URL Update (newnovels.html သို့ ပြန်သွားရန်)
    document.getElementById('prevPageBtn').href = `${category}.html`;

    function getBaseTitle(fullTitle) {
      if (!fullTitle) return '';
      let clean = fullTitle.trim();
      if (clean.toLowerCase().includes('shadow slave')) return 'shadow slave';
      if (clean.includes('ကောင်းကင်ဘုံကို')) return 'ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်';
      return clean.split(/::|-|\.\.|chapter/i)[0].trim().toLowerCase();
    }

    async function loadNovelDetails() {
      if (!currentId) return;

      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, category));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const currentPost = data[currentId];

          if (currentPost) {
            const rawTitle = currentPost.title || '';
            const targetBaseName = getBaseTitle(rawTitle);

            let mainBookTitle = rawTitle.split(/::|-|\.\.|chapter/i)[0].trim();

            document.getElementById('novelTitle').textContent = mainBookTitle;
            document.getElementById('novelAuthor').textContent = currentPost.author || 'translate by Hunter';
            document.getElementById('novelSummary').textContent = currentPost.summary || currentPost.content || 'အကြောင်းအရာ မရှိသေးပါ။';
            
            if (currentPost.image || currentPost.img) {
              document.getElementById('novelCover').src = currentPost.image || currentPost.img;
            }

            // တူညီသော ဝတ္ထု၏ အခန်းများအားလုံးကို စစ်ထုတ်ပြီး စာရင်းပြခြင်း
            const allKeys = Object.keys(data);
            const filteredKeys = allKeys.filter(key => getBaseTitle(data[key].title) === targetBaseName);

            const chapterListEl = document.getElementById('chapterList');
            chapterListEl.innerHTML = '';

            filteredKeys.forEach(key => {
              const item = data[key];
              let chapterTitle = item.title || key;

              const link = document.createElement('a');
              link.href = `read.html?category=${category}&id=${key}`;
              link.className = 'block p-3 bg-gray-50 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg text-xs md:text-sm font-medium border border-gray-100 transition flex justify-between items-center';
              link.innerHTML = `
                <span>${chapterTitle}</span>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
              `;
              chapterListEl.appendChild(link);
            });
          }
        }
      } catch (err) {
        console.error("Novel Details Error:", err);
      }
    }

    loadNovelDetails();
  </script>
</body>
</html>
