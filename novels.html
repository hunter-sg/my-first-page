<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ဝတ္ထုအသေးစိတ် - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
    body { font-family: 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between gap-2">
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <img src="photo_2026-09-07_21-25-15.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-sm md:text-base font-bold tracking-wide">စာပေဥယျာဥ်</h1>
      </a>

      <div class="bg-indigo-950/60 border border-indigo-800 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
        <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
        <span id="dateDisplay" class="font-medium">00/00/0000</span>
      </div>

      <nav class="flex items-center space-x-3 text-sm">
        <a href="newnovels.html" class="text-amber-400 hover:underline flex items-center gap-1 text-xs md:text-sm">
          <i class="fa-solid fa-arrow-left"></i> ဝတ္ထုစင်သို့
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto my-6 px-4 flex-grow max-w-4xl">
    
    <!-- Novel Details Header Card -->
    <div id="novelHeader" class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-gray-100 mb-6 flex flex-col sm:flex-row gap-5 items-start">
      <div id="novelCover" class="w-full sm:w-36 h-52 bg-indigo-50 rounded-xl overflow-hidden flex-shrink-0 border border-gray-100 flex items-center justify-center">
        <i class="fa-solid fa-spinner fa-spin text-indigo-400 text-xl"></i>
      </div>
      
      <div class="flex-1">
        <h1 id="novelTitle" class="text-xl md:text-2xl font-bold text-gray-800 mb-2">ဝတ္ထုအမည် ရယူနေသည်...</h1>
        <p id="novelAuthor" class="text-xs text-indigo-600 font-semibold mb-4">ရေးသားသူ - ...</p>
        
        <div class="bg-gray-50/80 p-3.5 rounded-xl border border-gray-100 mb-4">
          <h3 class="text-xs font-bold text-gray-700 mb-1 flex items-center gap-1.5">
            <i class="fa-solid fa-align-left text-indigo-500"></i> အကျဉ်းချုပ် (Summary)
          </h3>
          <p id="novelSummary" class="text-xs text-gray-600 leading-relaxed whitespace-pre-line">...</p>
        </div>
      </div>
    </div>

    <!-- Chapter List Section -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
      <h2 class="text-sm md:text-base font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
        <i class="fa-solid fa-list-ol text-indigo-600"></i>
        အခန်းများ စာရင်း (Chapter Lists)
      </h2>

      <div id="chaptersList" class="space-y-2">
        <div class="text-center py-6 text-gray-400 text-xs">
          <i class="fa-solid fa-spinner fa-spin mr-1"></i> အခန်းများကို ရယူနေပါသည်...
        </div>
      </div>
    </div>

  </main>

  <footer class="bg-indigo-950 text-indigo-200 py-4 text-center text-xs mt-10">
    <p>© 2026 စာပေဥယျာဉ်. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Live Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
      document.getElementById('dateDisplay').textContent = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Get Book ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    async function loadNovelDetails() {
      if (!bookId) {
        alert("ဝတ္ထု ရွေးချယ်မှု မှားယွင်းနေပါသည်။");
        window.location.href = "newnovels.html";
        return;
      }

      try {
        const novelSnapshot = await get(ref(database, `novels/${bookId}`));
        if (!novelSnapshot.exists()) {
          alert("ဝတ္ထု ရှာမတွေ့ပါ။");
          window.location.href = "newnovels.html";
          return;
        }

        const novel = novelSnapshot.val();

        // Display Book Details
        document.getElementById('novelTitle').textContent = novel.title;
        document.getElementById('novelAuthor').textContent = `ရေးသားသူ - ${novel.author}`;
        document.getElementById('novelSummary').textContent = novel.summary || 'အကျဉ်းချုပ် မရှိသေးပါ။';

        const coverContainer = document.getElementById('novelCover');
        if (novel.coverImage) {
          coverContainer.innerHTML = `<img src="${novel.coverImage}" class="w-full h-full object-cover" />`;
        } else {
          coverContainer.innerHTML = `<i class="fa-solid fa-book-open text-indigo-400 text-3xl"></i>`;
        }

        // Display Chapters
        const chaptersList = document.getElementById('chaptersList');
        chaptersList.innerHTML = '';

        if (novel.chapters && Object.keys(novel.chapters).length > 0) {
          const sortedChapters = Object.entries(novel.chapters).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

          sortedChapters.forEach(([chapId, chap]) => {
            const subTitleText = chap.subTitle ? ` - ${chap.subTitle}` : '';
            chaptersList.innerHTML += `
              <a href="read.html?cat=novels&bookId=${bookId}&chapId=${chapId}" class="flex items-center justify-between p-3 rounded-xl border border-gray-100 hover:border-indigo-200 hover:bg-indigo-50/50 transition group">
                <div class="flex items-center gap-2.5">
                  <span class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-800 font-bold text-xs flex items-center justify-center flex-shrink-0">
                    <i class="fa-regular fa-file-lines"></i>
                  </span>
                  <div>
                    <h4 class="text-xs md:text-sm font-bold text-gray-800 group-hover:text-indigo-900 transition">
                      ${chap.chapterTitle}${subTitleText}
                    </h4>
                    <span class="text-[10px] text-gray-400">${chap.date || ''}</span>
                  </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-300 group-hover:text-indigo-600 transition"></i>
              </a>
            `;
          });
        } else {
          chaptersList.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">အခန်းများ မရှိသေးပါ။</div>`;
        }

      } catch (err) {
        console.error("Error loading novel:", err);
      }
    }

    loadNovelDetails();
  </script>
</body>
</html>
