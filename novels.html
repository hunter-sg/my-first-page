<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Details - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-900 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header Section -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a id="prevPageBtn" href="newnovels.html" class="flex items-center gap-2 text-amber-500 font-bold hover:text-amber-400 text-sm">
        <i class="fa-solid fa-arrow-left"></i>
        <span>စာအုပ်စင်သို့</span>
      </a>
      <h1 id="headerNovelTitle" class="text-amber-500 font-bold text-lg truncate max-w-[200px] sm:max-w-xs text-center">
        စာပေဥယျာဉ်
      </h1>
      <div></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow">
    
    <!-- Novel Details Card -->
    <div class="bg-white text-gray-800 rounded-xl shadow-lg p-6 mb-6">
      <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start">
        
        <!-- Cover Image -->
        <div class="w-48 h-64 bg-gray-200 rounded-lg overflow-hidden flex-shrink-0 shadow-md">
          <img id="novelCover" src="" alt="Novel Cover" class="w-full h-full object-cover hidden">
        </div>

        <!-- Info & Summary -->
        <div class="flex-grow w-full">
          <div class="flex items-center gap-2 text-amber-600 font-semibold text-sm mb-1">
            <i class="fa-solid fa-circle-info"></i>
            <span id="novelAuthor">translate by Hunter</span>
          </div>
          
          <h2 id="novelTitle" class="text-2xl font-bold text-gray-900 mb-2">...</h2>
          
          <div class="flex items-center gap-1 text-amber-500 text-sm mb-4">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half-stroke"></i>
            <span class="text-gray-500 ml-2">4.3 / 5 (1424 votes)</span>
          </div>

          <div class="border-t border-gray-100 pt-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
              <i class="fa-solid fa-align-left mr-1"></i> SUMMARY
            </h3>
            <p id="novelSummary" class="text-gray-600 text-sm leading-relaxed max-h-36 overflow-y-auto pr-2">
              ...
            </p>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap justify-end gap-3 mt-6 border-t border-gray-100 pt-4">
        <a href="#chapterListSection" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-5 rounded-lg text-sm flex items-center gap-2 shadow transition">
          <i class="fa-solid fa-list-ul"></i> CHAPTER LIST
        </a>
        <a id="readFirstBtn" href="#" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-5 rounded-lg text-sm flex items-center gap-2 shadow transition">
          <i class="fa-solid fa-circle-arrow-right"></i> READ FIRST
        </a>
      </div>
    </div>

    <!-- Chapter List Section -->
    <div id="chapterListSection" class="bg-white text-gray-800 rounded-xl shadow-lg p-6 mb-6">
      <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2 border-b pb-2">
        <i class="fa-solid fa-list text-amber-500"></i> အခန်းစဉ်များ
      </h3>
      <div id="chapterList" class="flex flex-col gap-1 max-h-96 overflow-y-auto">
        <!-- Chapters will load here dynamically -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 text-gray-500 text-center py-4 text-xs">
    © 2026 Literature Garden. All rights reserved.
  </footer>

  <!-- Firebase Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category') || 'newnovels';
    let currentId = urlParams.get('id');

    const prevBtn = document.getElementById('prevPageBtn');
    if (prevBtn) prevBtn.href = `${category}.html`;

    function getBaseTitle(fullTitle) {
      if (!fullTitle) return '';
      let clean = fullTitle.trim();
      if (clean.toLowerCase().includes('shadow slave')) return 'shadow slave';
      if (clean.includes('ကောင်းကင်ဘုံကို')) return 'ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်';
      return clean.split(/::|-|\.\.|chapter/i)[0].trim().toLowerCase();
    }

    async function loadNovelDetails() {
      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, category));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const allKeys = Object.keys(data);

          if (allKeys.length === 0) return;

          if (!currentId || !data[currentId]) {
            currentId = allKeys[0];
          }

          const currentPost = data[currentId];
          const rawTitle = currentPost.title || '';
          const targetBaseName = getBaseTitle(rawTitle);
          let mainBookTitle = rawTitle.split(/::|-|\.\.|chapter/i)[0].trim() || rawTitle;

          const filteredKeys = allKeys.filter(key => getBaseTitle(data[key].title) === targetBaseName);

          // Image Load
          let coverUrl = currentPost.image || currentPost.imageUrl || currentPost.img || currentPost.cover || '';
          if (!coverUrl && filteredKeys.length > 0) {
            for (let k of filteredKeys) {
              const imgFound = data[k].image || data[k].imageUrl || data[k].img || data[k].cover;
              if (imgFound) {
                coverUrl = imgFound;
                break;
              }
            }
          }

          const coverImgEl = document.getElementById('novelCover');
          if (coverImgEl) {
            if (coverUrl) {
              coverImgEl.src = coverUrl;
            } else {
              coverImgEl.src = 'https://via.placeholder.com/200x260?text=No+Cover';
            }
            coverImgEl.classList.remove('hidden');
          }

          // Summary Load
          let summaryText = currentPost.summary || currentPost.description || '';
          if (!summaryText && filteredKeys.length > 0) {
            for (let k of filteredKeys) {
              if (data[k].summary || data[k].description) {
                summaryText = data[k].summary || data[k].description;
                break;
              }
            }
          }

          if (!summaryText) {
            const mainContent = currentPost.content || '';
            summaryText = mainContent.length > 200 ? mainContent.substring(0, 200) + '...' : mainContent;
          }

          if (document.getElementById('headerNovelTitle')) document.getElementById('headerNovelTitle').textContent = mainBookTitle;
          if (document.getElementById('novelTitle')) document.getElementById('novelTitle').textContent = mainBookTitle;
          if (document.getElementById('novelAuthor')) document.getElementById('novelAuthor').textContent = currentPost.author || 'translate by Hunter';
          if (document.getElementById('novelSummary')) document.getElementById('novelSummary').textContent = summaryText || 'အကြောင်းအရာ ဖော်ပြချက် မရှိသေးပါ။';

          const readFirstBtn = document.getElementById('readFirstBtn');
          if (readFirstBtn && filteredKeys.length > 0) {
            readFirstBtn.href = `read.html?category=${category}&id=${filteredKeys[0]}`;
          }

          const createChapterElement = (key) => {
            const item = data[key];
            const chapterTitle = item.title || key;

            const link = document.createElement('a');
            link.href = `read.html?category=${category}&id=${key}`;
            link.className = 'flex items-center gap-2 py-2 px-1 text-gray-700 hover:text-amber-600 border-b border-dashed border-gray-200 transition truncate';
            link.innerHTML = `
              <i class="fa-solid fa-book text-gray-800 text-xs flex-shrink-0"></i>
              <span class="truncate">${chapterTitle}</span>
            `;
            return link;
          };

          const chapterListEl = document.getElementById('chapterList');
          if (chapterListEl) {
            chapterListEl.innerHTML = '';
            filteredKeys.forEach(key => chapterListEl.appendChild(createChapterElement(key)));
          }

        }
      } catch (err) {
        console.error("Novel Details Error:", err);
      }
    }

    loadNovelDetails();
  </script>
</body>
</html>
