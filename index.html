<!DOCTYPE html> 
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာပေဥယျာဉ် - ပင်မစာမျက်နှာ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between gap-2">
      
      <!-- Logo & Brand -->
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <img src="photo_2026-09-07_21-25-15.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-sm md:text-base font-bold tracking-wide">စာပေဥယျာဥ်</h1>
      </a>

      <!-- search bar and Live Clock -->
      
      <div class="bg-indigo-950/60 border border-indigo-800 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
        <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
        <span id="dateDisplay" class="font-medium">00/00/0000</span>
      </div>

      <!-- Mobile Menu Button -->
      <button id="menuToggleBtn" class="text-amber-400 text-lg p-1 focus:outline-none">
        <i class="fa-solid fa-bars" id="menuIcon"></i>
      </button>
    </div>

    <!-- Mobile Dropdown Menu Box (အောက်သို့ သီးသန့် ကျလာမည့် Box) -->
    <div id="mobileMenu" class="hidden bg-indigo-950 border-t border-indigo-800 px-4 py-3 shadow-xl">
      <nav class="flex flex-col space-y-2 text-sm">
        <a href="index.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-house text-amber-400"></i> ပင်မစာမျက်နှာ
        </a>
        <a href="newnovels.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-book text-amber-400"></i> ဝတ္ထုစင်
        </a>
        <a href="knowledges.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-lightbulb text-amber-400"></i> သုတရသ
        </a>
        <a href="sports.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-football text-amber-400"></i> အားကစား
        </a>
        <a href="poems.html" class="p-2 rounded-lg bg-indigo-900/60 text-amber-300 hover:bg-indigo-800 flex items-center gap-2">
          <i class="fa-solid fa-feather text-amber-400"></i> ကဗျာ
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto my-6 px-4 flex-grow max-w-4xl">
    
    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-gray-100 mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
          <span class="p-2 bg-indigo-100 text-indigo-800 rounded-lg text-sm"><i class="fa-solid fa-clock-rotate-left"></i></span>
          နောက်ဆုံးတင်ခဲ့သော စာမူများ
        </h2>
        <p class="text-xs text-gray-500 mt-1">ကဏ္ဍပေါင်းစုံမှ နောက်ဆုံးထွက် စာမူများ</p>
      </div>
      <a href="submit.html" class="hidden sm:inline-flex items-center gap-1.5 bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-3.5 py-2 rounded-lg font-bold transition">
        <i class="fa-solid fa-pen-to-square"></i> စာမူတင်ရန်
      </a>
    </div>

    <!-- Posts Container -->
    <div id="postsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-10 text-gray-400 text-xs">
        <i class="fa-solid fa-spinner fa-spin text-lg mr-2"></i> စာမူများကို ရယူနေပါသည်...
      </div>
    </div>
  </main>

  <!-- Detail Modal Popup -->
  <div id="postModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div id="modalContent" class="w-full flex justify-center"></div>
  </div>

  <footer class="bg-indigo-950 text-indigo-200 py-4 text-center text-xs mt-10">
    <p>© 2026 စာပေဥယျာဉ်. All rights reserved.</p>
  </footer>

  <!-- Firebase & Logic Script -->
  <script type="module">
    document.getElementById('menuToggleBtn').addEventListener('click', () => {
      const mobileMenu = document.getElementById('mobileMenu');
      const menuIcon = document.getElementById('menuIcon');
      
      mobileMenu.classList.toggle('hidden');
      menuIcon.classList.toggle('fa-bars');
      menuIcon.classList.toggle('fa-xmark');
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const postsContainer = document.getElementById('postsContainer');

    // Live Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      const timeEl = document.getElementById('timeDisplay');
      const dateEl = document.getElementById('dateDisplay');

      if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;
      if (dateEl) dateEl.textContent = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const categories = ['knowledges', 'novels', 'sports', 'poems'];
    const postsByCategory = {};
    let allPosts = [];

    // Load Posts
    function loadAllPosts() {
      categories.forEach(category => {
        onValue(ref(database, category), (snapshot) => {
          const data = snapshot.val();
          postsByCategory[category] = [];

          if (data) {
            Object.entries(data).forEach(([key, val]) => {
              postsByCategory[category].push({
                id: key,
                category: category,
                categoryName: getCategoryName(category),
                title: val.title || val.bookTitle || 'ခေါင်းစဉ်မရှိ',
                author: val.author || 'မသိရပါ',
                content: val.content || val.summary || '',
                date: val.date || '',
                image: val.image || val.imageUrl || val.img || val.coverImage || '',
                likes: val.likes || 0,
                views: val.views || 0,
                comments: val.comments || {}
              });
            });
          }

          allPosts = Object.values(postsByCategory).flat();
          renderPosts();
        });
      });
    }

    function getCategoryName(cat) {
      switch(cat) {
        case 'knowledges': return 'သုတရသ';
        case 'novels': return 'ဝတ္ထု';
        case 'sports': return 'အားကစား';
        case 'poems': return 'ကဗျာ';
        default: return 'အခြား';
      }
    }

    function renderPosts() {
      postsContainer.innerHTML = '';

      if (allPosts.length === 0) {
        postsContainer.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs">စာမူများ မရှိသေးပါ။</div>`;
        return;
      }

      allPosts.sort((a, b) => b.id.localeCompare(a.id));

      allPosts.forEach(post => {
        const imageMarkup = post.image 
          ? `<img src="${post.image}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0 border border-gray-100" />`
          : `<div class="w-20 h-20 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 flex-shrink-0 border border-indigo-100"><i class="fa-solid fa-book-open text-xl"></i></div>`;

        postsContainer.innerHTML += `
          <div onclick="openModal('${post.category}', '${post.id}')" class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:border-indigo-200 transition cursor-pointer flex gap-3.5 items-center">
            ${imageMarkup}
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-[10px] px-2 py-0.5 bg-indigo-100 text-indigo-800 font-bold rounded">${post.categoryName}</span>
                <span class="text-[11px] text-gray-400">${post.date}</span>
              </div>
              <h3 class="text-xs font-bold text-gray-800 truncate mb-1">${post.title}</h3>
              <p class="text-[11px] text-gray-500 truncate mb-2">${post.content}</p>
              
              <div class="flex items-center justify-between text-[11px] text-gray-400 border-t border-gray-50 pt-1.5">
                <span class="text-indigo-600 font-semibold truncate">ရေးသားသူ - ${post.author}</span>
                <div class="flex items-center gap-3 flex-shrink-0">
                  <span class="flex items-center gap-1 hover:text-red-500 transition" onclick="event.stopPropagation(); handleLike('${post.category}', '${post.id}')">
                    <i class="fa-solid fa-heart text-red-400"></i> ${post.likes}
                  </span>
                  <span class="flex items-center gap-1">
                    <i class="fa-solid fa-eye text-indigo-400"></i> ${post.views}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    // Handle Like
    window.handleLike = function(category, postId) {
      const postRef = ref(database, `${category}/${postId}/likes`);
      runTransaction(postRef, (currentLikes) => {
        return (currentLikes || 0) + 1;
      });
    };

    // Open Modal (မြင်ကွင်းကျယ်)
    window.openModal = function(category, postId) {
      const post = allPosts.find(p => p.id === postId && p.category === category);
      if (!post) return;

      const viewsRef = ref(database, `${category}/${postId}/views`);
      runTransaction(viewsRef, (currentViews) => {
        return (currentViews || 0) + 1;
      });

      const modalContainer = document.getElementById('postModal');
      const modalContent = document.getElementById('modalContent');

      const imageHtml = post.image 
        ? `<div class="mb-4 overflow-hidden rounded-xl border border-gray-100 shadow-sm flex justify-center bg-black/5">
             <img src="${post.image}" class="w-full max-h-[450px] object-contain rounded-xl" />
           </div>`
        : '';

      let commentsHtml = '';
      if (post.comments && Object.keys(post.comments).length > 0) {
        Object.values(post.comments).forEach(c => {
          commentsHtml += `
            <div class="bg-gray-100/70 p-3 rounded-lg text-xs md:text-sm space-y-1">
              <div class="flex justify-between font-bold text-indigo-950">
                <span>${c.name || 'ဧည့်သည်'}</span>
                <span class="text-gray-400 text-xs font-normal">${c.date || ''}</span>
              </div>
              <p class="text-gray-700 leading-relaxed">${c.text}</p>
            </div>
          `;
        });
      } else {
        commentsHtml = `<p class="text-xs text-gray-400 text-center py-2">မှတ်ချက်များ မရှိသေးပါ။</p>`;
      }

      modalContent.innerHTML = `
        <div class="bg-white rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl border border-gray-100 flex flex-col max-h-[92vh]">
          
          <div class="bg-indigo-50/70 px-5 py-4 border-b border-indigo-100 flex justify-between items-start flex-shrink-0">
            <div class="pr-2">
              <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                <span class="text-xs px-2.5 py-0.5 bg-indigo-100 text-indigo-800 font-bold rounded-md">${post.categoryName}</span>
                <span class="text-xs md:text-sm text-gray-600 font-medium">ရေးသားသူ - ${post.author}</span>
                <span class="text-xs text-gray-400">• ${post.date}</span>
              </div>
              <h2 class="text-base md:text-xl font-bold text-gray-800 leading-snug">${post.title}</h2>
            </div>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl p-1 transition flex-shrink-0"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <div class="p-5 md:p-6 overflow-y-auto max-h-[78vh] space-y-5">
            ${imageHtml}
            <div class="bg-gray-50/70 p-4 md:p-6 rounded-xl border border-gray-100 text-sm md:text-base text-gray-800 leading-relaxed md:leading-loose space-y-4">
              <p class="whitespace-pre-line">${post.content}</p>
            </div>

            <div class="flex items-center justify-between text-xs md:text-sm px-2 py-2 text-gray-500 border-y border-gray-100">
              <button onclick="handleLike('${post.category}', '${post.id}')" class="flex items-center gap-1.5 text-red-500 font-bold hover:bg-red-50 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-heart"></i> ကြိုက်နှစ်သက်သူ (${post.likes})
              </button>
              <span class="flex items-center gap-1.5 text-indigo-600 font-medium">
                <i class="fa-solid fa-eye"></i> ကြည့်ရှုသူ (${post.views + 1})
              </span>
            </div>

            <div class="border-t border-gray-100 pt-4 space-y-4">
              <h4 class="text-xs md:text-sm font-bold text-gray-800 flex items-center gap-2"><i class="fa-regular fa-comments text-indigo-600"></i> မှတ်ချက်များ</h4>
              
              <div class="space-y-2 bg-indigo-50/40 p-3.5 rounded-xl border border-indigo-50">
                <input type="text" id="commentName" placeholder="သင့်နာမည် ရေးပါ..." class="w-full text-xs md:text-sm p-2.5 rounded-lg border border-gray-200 outline-none focus:ring-1 focus:ring-indigo-500">
                <textarea id="commentText" rows="2" placeholder="မှတ်ချက် ရေးရန်..." class="w-full text-xs md:text-sm p-2.5 rounded-lg border border-gray-200 outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                <button onclick="addComment('${post.category}', '${post.id}')" class="bg-indigo-900 text-white text-xs md:text-sm px-4 py-2 rounded-lg font-semibold hover:bg-indigo-800 transition float-right">မှတ်ချက် ပို့မည်</button>
                <div class="clear-both"></div>
              </div>

              <div class="space-y-2.5 mt-3">${commentsHtml}</div>
            </div>
          </div>

          <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-end flex-shrink-0">
            <button onclick="closeModal()" class="bg-indigo-900 hover:bg-indigo-800 text-white text-xs md:text-sm px-6 py-2 rounded-lg font-bold transition">ပိတ်မည်</button>
          </div>
        </div>
      `;

      modalContainer.classList.remove('hidden');
      modalContainer.classList.add('flex');
    };

    // Add Comment
    window.addComment = async function(category, postId) {
      const nameInput = document.getElementById('commentName');
      const textInput = document.getElementById('commentText');
      
      if (!textInput.value.trim()) return alert("မှတ်ချက် စာသား ရေးပေးပါ!");

      try {
        await push(ref(database, `${category}/${postId}/comments`), {
          name: nameInput.value.trim() || 'ဧည့်သည်',
          text: textInput.value.trim(),
          date: new Date().toLocaleDateString('en-GB')
        });
        alert("မှတ်ချက် တင်ပြီးပါပြီ!");
        closeModal();
      } catch (err) {
        alert("မှတ်ချက် တင်၍ မရပါ: " + err.message);
      }
    };

    // Close Modal
    window.closeModal = function() {
      const modalContainer = document.getElementById('postModal');
      if (modalContainer) {
        modalContainer.classList.add('hidden');
        modalContainer.classList.remove('flex');
      }
    };

    loadAllPosts();
  </script>
</body>
</html>
