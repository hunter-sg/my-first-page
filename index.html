<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာပေဥယျာဉ် - ပင်မစာမျက်နှာ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between gap-2">
    
    <!-- 1. Left: Logo & Brand Name -->
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <img src="logo.png" alt="Logo" class="w-8 h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-sm md:text-base font-bold tracking-wide">စာပေဥယျာဥ်</h1>
      </a>

    <!-- 2. Middle: Search Bar & Live Time -->
      <div class="flex items-center gap-2 flex-1 max-w-xs md:max-w-md mx-2">
      <!-- Search Input -->
        <div class="relative w-full">
          <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="ရှာဖွေရန်..." class="w-full bg-indigo-950/80 text-white placeholder-indigo-300 text-xs rounded-full pl-8 pr-3 py-1.5 border border-indigo-700/60 focus:outline-none focus:border-amber-400 transition">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-indigo-400 text-xs"></i>
        </div>
      <!-- Live Time Display -->
        <div id="liveClock" class="hidden sm:block text-[10px] font-mono bg-indigo-950/60 px-2 py-1 rounded-md border border-indigo-800/50 text-amber-300 flex-shrink-0">
          00:00:00
        </div>
      </div>

    <!-- 3. Mobile Menu Button -->
      <button id="menuBtn" class="text-white text-base focus:outline-none md:hidden">
        <i id="menuIcon" class="fa-solid fa-bars"></i>
      </button>

    <!-- 4. Right: Navigation Menu Links -->
      <nav id="menuList" class="hidden md:flex space-x-4 lg:space-x-6 text-xs font-semibold flex-shrink-0">
        <a href="index.html" class="text-amber-400 font-bold border-b-2 border-amber-400 pb-0.5">ပင်မ</a>
        <a href="knowledges.html" class="hover:text-indigo-200">သုတရသ</a>
        <a href="newnovels.html" class="hover:text-indigo-200">ဝတ္ထု</a>
        <a href="sports.html" class="hover:text-indigo-200">အားကစား</a>
        <a href="poems.html" class="hover:text-indigo-200">ကဗျာ</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto my-8 px-4 flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left Side: နောက်ဆုံးတင်ခဲ့သော စာမူများ -->
      <div class="lg:col-span-6 bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
        <div class="flex justify-between items-center pb-3 border-b border-gray-100">
          <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> နောက်ဆုံးတင်ခဲ့သော စာမူများ
          </h3>
          <span class="text-xs text-indigo-600 font-semibold">လတ်တလော</span>
        </div>

        <!-- Feed Container -->
        <div id="latestPostsContainer" class="space-y-3">
          <div class="text-center py-6 text-gray-400 text-xs">
            <i class="fa-solid fa-spinner fa-spin mr-1"></i> ရယူနေပါသည်...
          </div>
        </div>
      </div>

      <!-- Right Side: ပင်မ မိတ်ဆက် -->
      <div class="lg:col-span-6 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-800 rounded-full flex items-center justify-center text-xl mb-3">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <h3 class="text-xl font-bold text-gray-800 mb-2">ပင်မစာမျက်နှာသို့ ရောက်ရှိပါပြီ</h3>
        <p class="text-gray-500 text-xs leading-relaxed max-w-sm mb-4">
          အထွေထွေသုတရသများ၊ ဝတ္ထုတိုများနှင့် အခြားကဏ္ဍများကို အပေါ်ဘက်ရှိ မီနူး (Menu) မှတစ်ဆင့် ဝင်ရောက်ဖတ်ရှုနိုင်ပါသည်။
        </p>
        <a href="knowledges.html" class="bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-5 py-2 rounded-lg font-bold transition">
          သုတရသများ ဖတ်ရှုရန်
        </a>
      </div>

    </div>
  </main>

  <!-- Firebase Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const container = document.getElementById('latestPostsContainer');

    // Mobile Menu Toggle Logic
    const menuBtn = document.getElementById('menuBtn');
    const menuList = document.getElementById('menuList');
    const menuIcon = document.getElementById('menuIcon');

    if (menuBtn && menuList && menuIcon) {
      menuBtn.onclick = () => {
        menuList.classList.toggle('hidden');
        menuIcon.className = menuList.classList.contains('hidden') ? "fa-solid fa-bars" : "fa-solid fa-xmark";
      };
    }

    // Categories Configuration
    const categories = [
      { name: 'knowledges', label: 'သုတရသ', page: 'knowledges.html', color: 'bg-blue-50 text-blue-700' },
      { name: 'novels', label: 'ဝတ္ထု', page: 'newnovels.html', color: 'bg-emerald-50 text-emerald-700' },
      { name: 'sports', label: 'အားကစား', page: 'sports.html', color: 'bg-amber-50 text-amber-700' },
      { name: 'poems', label: 'ကဗျာ', page: 'poems.html', color: 'bg-purple-50 text-purple-700' }
    ];

    let allPosts = [];
    let loadedCount = 0;

    categories.forEach(cat => {
      onValue(ref(database, cat.name), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          Object.entries(data).forEach(([key, val]) => {
            allPosts.push({
              id: key,
              title: val.title || 'ခေါင်းစဉ်မရှိ',
              content: val.content || '',
              author: val.author || 'မသိရပါ',
              date: val.date || '',
              imgSrc: val.image || val.imageUrl || val.img || '',
              categoryLabel: cat.label,
              categoryColor: cat.color,
              targetPage: cat.page
            });
          });
        }
        
        loadedCount++;
        if (loadedCount === categories.length) {
          renderLatestPosts();
        }
      }, { onlyOnce: true });
    });

    function renderLatestPosts() {
      if (!container) return;
      container.innerHTML = '';

      if (allPosts.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">စာမူများ မရှိသေးပါ။</p>`;
        return;
      }

      // Sort Posts by Firebase Key (Newest First)
      allPosts.sort((a, b) => b.id.localeCompare(a.id));

      const latestList = allPosts.slice(0, 5);

      latestList.forEach(post => {
        const imageMarkup = post.imgSrc 
          ? `<img src="${post.imgSrc}" class="w-14 h-14 rounded-md object-cover flex-shrink-0 border border-gray-100" alt="post thumbnail" />`
          : '';

        container.innerHTML += `
          <a href="${post.targetPage}" class="block p-2.5 rounded-lg border border-gray-100 hover:bg-indigo-50/50 hover:border-indigo-100 transition group">
            <div class="flex items-center gap-3">
              ${imageMarkup}
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="text-[10px] px-2 py-0.5 rounded font-bold ${post.categoryColor}">${post.categoryLabel}</span>
                  <span class="text-[11px] text-gray-400">${post.date}</span>
                </div>
                <h4 class="text-xs font-bold text-gray-800 truncate group-hover:text-indigo-900">
                  ${post.title}
                </h4>
                <p class="text-[11px] text-gray-500 truncate mt-0.5">
                  ${post.content}
                </p>
              </div>
            </div>
          </a>
        `;
      });
    }
  </script>
</body>
</html>
