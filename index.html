<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာပေဥယျာဥ်</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- Header Navigation -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40 relative">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between gap-3">
      
      <!-- 1. Left: Logo & Brand Name -->
      <a href="index.html" class="flex items-center gap-1.5 flex-shrink-0">
        <img src="photo_2026-09-07_21-25-15.jpg" alt="Logo" class="w-7 h-7 md:w-8 md:h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-xs md:text-base font-bold tracking-wide">စာပေဥယျာဥ်</h1>
      </a>

      <!-- 2. Middle: Full-Width Search Bar -->
      <div class="flex-1 max-w-xs md:max-w-md mx-1">
        <div class="relative w-full">
          <input type="text" id="searchInput" oninput="searchPosts()" placeholder="ရှာဖွေရန်..." class="w-full bg-indigo-950/80 text-white placeholder-indigo-300 text-xs rounded-full pl-8 pr-3 py-1.5 border border-indigo-700/60 focus:outline-none focus:border-amber-400 transition">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-indigo-400 text-xs"></i>
        </div>
      </div>

      <!-- 3. Mobile Menu Toggle Button -->
      <button id="menuBtn" class="text-white text-base focus:outline-none md:hidden p-1 rounded-lg hover:bg-indigo-800 transition flex-shrink-0">
        <i id="menuIcon" class="fa-solid fa-bars"></i>
      </button>

      <!-- 4. Navigation Links (Dropdown) -->
      <nav id="menuList" class="hidden absolute top-full left-0 right-0 bg-indigo-950 border-t border-indigo-800/80 p-4 shadow-xl flex-col gap-4 text-xs font-semibold md:static md:flex md:flex-row md:bg-transparent md:border-none md:p-0 md:shadow-none md:gap-6 lg:gap-8 flex-shrink-0 z-50">
        <a href="index.html" class="text-amber-400 font-bold border-b-2 border-amber-400 pb-1 px-1.5 transition">ပင်မ</a>
        <a href="knowledges.html" class="hover:text-amber-300 py-1 md:py-0 px-1.5 transition">သုတရသ</a>
        <a href="newnovels.html" class="hover:text-amber-300 py-1 md:py-0 px-1.5 transition">ဝတ္ထု</a>
        <a href="sports.html" class="hover:text-amber-300 py-1 md:py-0 px-1.5 transition">အားကစား</a>
        <a href="poems.html" class="hover:text-amber-300 py-1 md:py-0 px-1.5 transition">ကဗျာ</a>
      </nav>

    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto my-6 px-4 flex-grow max-w-4xl">
    
    <!-- Section Header with Date/Time Box Stacked (Time on Top, Date on Bottom) -->
    <div class="flex items-center justify-between mb-4 px-1">
      <h2 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
        <span class="p-2 bg-indigo-100 text-indigo-800 rounded-lg text-sm">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </span> 
        နောက်ဆုံးတင်ခဲ့သော စာမူများ
      </h2>

      <!-- Live Time (Top) & Date (Bottom) Box -->
      <div class="bg-indigo-900 text-amber-300 px-3 py-1 rounded-lg shadow-sm border border-indigo-700/50 flex flex-col items-center justify-center text-center flex-shrink-0">
        <div id="liveTime" class="text-xs md:text-sm font-bold font-mono">00:00:00</div>
        <div id="liveDate" class="text-[9px] md:text-[10px] text-indigo-200 font-mono">08/09/2026</div>
      </div>
    </div>

    <!-- Posts Container (Where posts rendered via Firebase JS) -->
    <div id="postsContainer" class="grid grid-cols-1 gap-4">
      <!-- Dynamic posts will load here -->
    </div>

  </main>

  <!-- JavaScript Logic -->
  <script type="module">
    // သင့်ရဲ့ မူလ Firebase Config နဲ့ Import များကို ဤနေရာတွင် ထည့်ပါ
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      // သင့်ရဲ့ မူလ Config အမှန်အတိုင်း ထည့်ပါ
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPosts = [];
    const postsContainer = document.getElementById('postsContainer');

    // Mobile Menu Toggle
    const menuBtn = document.getElementById('menuBtn');
    const menuList = document.getElementById('menuList');
    const menuIcon = document.getElementById('menuIcon');

    if (menuBtn) {
      menuBtn.addEventListener('click', () => {
        menuList.classList.toggle('hidden');
        if (menuList.classList.contains('hidden')) {
          menuIcon.className = "fa-solid fa-bars";
        } else {
          menuIcon.className = "fa-solid fa-xmark";
        }
      });
    }

    // 🔴 ဤနေရာတွင် သင့်ရဲ့ မူလစာမူတွေ ယူထုတ်နေကျ 
    // (သို့မဟုတ် သင့် database collection နာမည်အမှန်များ) ကို ထည့်ပေးပါ
    async function loadAllPosts() {
      // ဥပမာ - သင့်ရဲ့ မူလ code ထဲက data ယူတဲ့ function ကို ဒီမှာ ပြန်ထည့်ပါ
      // ပြီးရင် allPosts Array ထဲကို post တွေကို push ပါ
    }

    // Real-time Search Function
    window.searchPosts = function() {
      const input = document.getElementById('searchInput').value.toLowerCase().trim();

      if (!input) {
        renderPosts(allPosts);
        return;
      }

      const filteredPosts = allPosts.filter(post => {
        const titleMatch = post.title?.toLowerCase().includes(input);
        const authorMatch = post.author?.toLowerCase().includes(input);
        const contentMatch = post.content?.toLowerCase().includes(input);
        return titleMatch || authorMatch || contentMatch;
      });

      renderPosts(filteredPosts);
    };

    // Render Posts Function
    function renderPosts(postsToRender = allPosts) {
      if (!postsContainer) return;
      postsContainer.innerHTML = '';

      if (postsToRender.length === 0) {
        postsContainer.innerHTML = `
          <div class="col-span-full text-center py-10 text-gray-400 text-xs">
            <i class="fa-solid fa-magnifying-glass text-xl mb-2 block"></i>
            ရှာဖွေမှုနှင့် ကိုက်ညီသော စာမူ မတွေ့ရှိပါ...
          </div>`;
        return;
      }

      postsToRender.forEach(post => {
        // သင့်ရဲ့ မူလ Card ပုံစံအတိုင်း ဒီနေရာမှာ ပြန်ဖော်ပြပါ
        postsContainer.innerHTML += `
          <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm transition flex gap-3.5 items-center">
            <div class="flex-1 min-w-0">
              <h3 class="text-xs font-bold text-gray-800 truncate mb-1">${post.title}</h3>
              <p class="text-[11px] text-gray-500 truncate mb-2">${post.content}</p>
            </div>
          </div>
        `;
      });
    }

    // Live Clock & Date Update (Time on top, Date on bottom)
    function updateClock() {
      const now = new Date();
      const timeElement = document.getElementById('liveTime');
      const dateElement = document.getElementById('liveDate');

      if (timeElement) timeElement.innerText = now.toLocaleTimeString();
      if (dateElement) dateElement.innerText = now.toLocaleDateString();
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
