<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Novels - Literature Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-indigo-950 text-white min-h-screen flex flex-col font-sans">

  <!-- Header & Navbar -->
  <header class="bg-indigo-900 border-b border-indigo-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      
      <!-- Logo & Title -->
      <a href="index.html" class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-full border-2 border-amber-400 overflow-hidden flex items-center justify-center bg-indigo-950">
          <i class="fa-solid fa-book-open text-amber-400 text-lg"></i>
        </div>
        <span class="text-xl font-bold text-amber-400 tracking-wide">စာပေဥယျာဉ်</span>
      </a>

      <!-- Search Bar -->
      <div class="relative hidden sm:block w-64">
        <input type="text" id="searchInput" placeholder="ရှာဖွေရန်..." class="w-full bg-indigo-950/80 text-sm text-white pl-9 pr-4 py-1.5 rounded-full border border-indigo-800 focus:outline-none focus:border-amber-400 placeholder-gray-400">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
      </div>

      <!-- Live Date & Time Box -->
      <div class="bg-indigo-950/60 border border-indigo-800 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
        <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
        <span id="dateDisplay" class="font-medium">00/00/0000</span>
      </div>

      <!-- Navigation Links -->
      <nav id="menuList" class="hidden md:flex items-center space-x-6 text-sm">
        <a href="index.html" class="text-white hover:text-amber-400 transition">ပင်မ</a>
        <a href="knowledges.html" class="text-white hover:text-amber-400 transition">သုတရသ</a>
        <a href="newnovels.html" class="text-amber-400 font-bold border-b-2 border-amber-400 pb-1">ဝတ္ထု</a>
        <a href="sports.html" class="text-white hover:text-amber-400 transition">အားကစား</a>
        <a href="poems.html" class="text-white hover:text-amber-400 transition">ကဗျာ</a>
      </nav>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">
    
    <!-- Section Heading -->
    <div class="flex items-center justify-between mb-6 border-b border-indigo-800/80 pb-3">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
        <i class="fa-solid fa-book-bookmark"></i> နောက်ဆုံးထွက် ဝတ္ထုများ
      </h1>
      <span class="text-xs text-gray-400">New & Popular Novels</span>
    </div>

    <!-- Novel Grid / List Container -->
    <div id="novelsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Loading State -->
      <div class="col-span-full text-center py-10 text-gray-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl text-amber-400 mb-2"></i>
        <p>ဝတ္ထုများ ရယူနေပါသည်...</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-indigo-900/60 border-t border-indigo-800 py-4 text-center text-xs text-gray-400 mt-8">
    <p>© 2026 Literature Garden. All rights reserved.</p>
  </footer>

  <!-- Main Script -->
  <script src="app.js"></script>
</body>
</html>
