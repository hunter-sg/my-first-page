<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ဝတ္ထုများ - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <!-- Header Section -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-book-bookmark text-amber-400"></i> စာပေဥယျာဥ်
    </a>
    <a href="index.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition">
      <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
    </a>
  </header>

  <!-- Banner/Title Section -->
  <main class="container mx-auto max-w-4xl my-6 px-4">
    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm mb-6 flex items-center gap-3">
      <div class="w-10 h-10 bg-amber-100 text-amber-800 rounded-xl flex items-center justify-center font-bold text-lg">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-gray-800">ဝတ္ထုတို / ဝတ္ထုရှည်များ</h1>
        <p class="text-xs text-gray-500">စိတ်ဝင်စားဖွယ်ရာ ဝတ္ထုကောင်းများကို ဖတ်ရှုရန်</p>
      </div>
    </div>

    <!-- Novels List Container -->
    <div id="novelsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-8 text-gray-400 text-xs">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> စာမူများကို ရယူနေပါသည်...
      </div>
    </div>
  </main>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function fetchNovels() {
      const novelsContainer = document.getElementById('novelsContainer');
      try {
        const snapshot = await get(ref(db, 'newnovels'));
        novelsContainer.innerHTML = '';

        if (snapshot.exists()) {
          const data = snapshot.val();
          const posts = Object.keys(data).map(key => ({ id: key, ...data[key] }));

          // ID ဖြင့် သာလွန်စဉ် စီပေးခြင်း
          posts.sort((a, b) => b.id.localeCompare(a.id));

          posts.forEach(post => {
            const imageMarkup = post.image
              ? `<img src="${post.image}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0">`
              : `<div class="w-20 h-20 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-400 flex-shrink-0"><i class="fa-solid fa-book-open text-2xl"></i></div>`;

            // Card ကို နှိပ်ပါက novels.html သို့ အချက်အလက်များပါ လမ်းကြောင်းလွှဲပေးခြင်း
            novelsContainer.innerHTML += `
              <div onclick="window.location.href='novels.html?category=newnovels&id=${post.id}'" 
                   class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:border-indigo-200 transition cursor-pointer flex gap-3.5 items-center">
                ${imageMarkup}
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <span class="text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded">ဝတ္ထု</span>
                    <span class="text-[11px] text-gray-400">${post.date || ''}</span>
                  </div>
                  <h3 class="text-xs font-bold text-gray-800 truncate mb-1">${post.title || 'ခေါင်းစဉ်မရှိ'}</h3>
                  <p class="text-[11px] text-gray-500 truncate mb-2">${post.content || ''}</p>
                  
                  <div class="flex items-center justify-between text-[11px] text-gray-400 border-t border-gray-50 pt-1.5">
                    <span class="text-indigo-600 font-semibold truncate">ရေးသားသူ - ${post.author || 'Unknown'}</span>
                    <div class="flex items-center gap-3 flex-shrink-0">
                      <span class="flex items-center gap-1">
                        <i class="fa-solid fa-heart text-red-400"></i> ${post.likes || 0}
                      </span>
                      <span class="flex items-center gap-1">
                        <i class="fa-solid fa-eye text-indigo-400"></i> ${post.views || 0}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          novelsContainer.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400 text-xs">ဝတ္ထုစာမူ မရှိသေးပါ။</div>`;
        }
      } catch (error) {
        console.error("Error fetching novels:", error);
        novelsContainer.innerHTML = `<div class="col-span-full text-center py-8 text-red-400 text-xs">အချက်အလက်များ ရယူရာတွင် အမှားအယွင်းရှိနေပါသည်။</div>`;
      }
    }

    fetchNovels();
  </script>
</body>
</html>
