<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ဝတ္ထု စာအုပ်စင် - Literature Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
    body { font-family: 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-[#1e1b4b] text-white min-h-screen flex flex-col">

  <header class="bg-[#2e2a72] border-b border-[#3b358c] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-full border-2 border-amber-400 overflow-hidden flex items-center justify-center bg-[#1e1b4b]">
          <i class="fa-solid fa-book-open text-amber-400 text-lg"></i>
        </div>
        <span class="text-xl font-bold text-amber-400 tracking-wide">စာပေဥယျာဉ်</span>
      </a>

      <div class="flex items-center space-x-3">
        <div class="bg-[#1b1744] border border-[#3b358c] text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
          <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
          <span id="dateDisplay" class="font-medium">00/00/0000</span>
        </div>
        <button id="menuToggleBtn" class="text-white text-xl p-2 focus:outline-none hover:text-amber-400 transition">
          <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
      </div>
    </div>

    <nav id="menuList" class="hidden bg-[#1e1b4b]/95 border-t border-[#3b358c] px-4 py-4 space-y-3">
      <a href="index.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-[#2e2a72]">ပင်မ</a>
      <a href="knowledges.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-[#2e2a72]">သုတရသ</a>
      <a href="newnovels.html" class="block px-3 py-2 text-amber-400 font-bold rounded bg-[#2e2a72]">ဝတ္ထု</a>
      <a href="sports.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-[#2e2a72]">အားကစား</a>
      <a href="poems.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-[#2e2a72]">ကဗျာ</a>
      <a href="submit.html" class="block bg-amber-500 text-slate-950 font-bold text-center px-4 py-2 rounded-lg transition mt-2">
        <i class="fa-solid fa-pen-to-square mr-1"></i> စာမူတင်ရန်
      </a>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">
    <div class="flex items-center justify-between mb-6 border-b border-[#3b358c]/80 pb-3">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
        <i class="fa-solid fa-book-bookmark text-amber-400"></i> ဝတ္ထု စာအုပ်စင်
      </h1>
    </div>

    <div id="booksContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      <div class="col-span-full text-center py-12 text-gray-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-400 mb-2"></i>
        <p class="text-sm">စာအုပ်များ ရယူနေပါသည်...</p>
      </div>
    </div>
  </main>

  <footer class="bg-[#2e2a72]/60 border-t border-[#3b358c] py-4 text-center text-xs text-gray-400 mt-auto">
    <p>© 2026 Literature Garden. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      const timeEl = document.getElementById('timeDisplay');
      const dateEl = document.getElementById('dateDisplay');

      if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;
      if (dateEl) dateEl.textContent = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const menuList = document.getElementById('menuList');
    const menuIcon = document.getElementById('menuIcon');

    if (menuToggleBtn && menuList) {
      menuToggleBtn.addEventListener('click', () => {
        menuList.classList.toggle('hidden');
        if (menuIcon) {
          menuIcon.classList.toggle('fa-bars');
          menuIcon.classList.toggle('fa-xmark');
        }
      });
    }

    const booksContainer = document.getElementById('booksContainer');
    const novelsRef = ref(db, 'novels');

    onValue(novelsRef, (snapshot) => {
      booksContainer.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        booksContainer.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i class="fa-solid fa-book-open text-4xl mb-3 text-indigo-700"></i>
            <p class="text-sm">စာအုပ်စင်တွင် စာအုပ်များ မရှိသေးပါ။</p>
          </div>`;
        return;
      }

      const bookList = Object.keys(data).map(key => ({
        id: key,
        ...data[key]
      })).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      bookList.forEach(book => {
        const coverImg = book.coverImage || 'https://via.placeholder.com/300x400/1e1b4b/amber400?text=No+Cover';
        const chapterCount = book.chapters ? Object.keys(book.chapters).length : 0;

        const cardHtml = `
          <div class="bg-[#24205a]/90 border border-[#3b358c] rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-amber-400/50 transition duration-300">
            <div class="relative h-60 overflow-hidden bg-[#18153d]">
              <img src="${coverImg}" alt="${book.title}" class="w-full h-full object-cover">
              <span class="absolute top-2 right-2 bg-amber-500 text-slate-950 text-xs font-bold px-2 py-0.5 rounded shadow">
                ${chapterCount} အခန်း
              </span>
            </div>
            
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <h2 class="font-bold text-amber-300 text-base line-clamp-1 mb-1">${book.title}</h2>
                <p class="text-xs text-gray-400 mb-2 flex items-center gap-1">
                  <i class="fa-solid fa-pen-nib text-[10px]"></i> ${book.author || 'အမည်မသိ'}
                </p>
                <p class="text-xs text-gray-300 line-clamp-2 leading-relaxed mb-4">
                  ${book.summary || 'အကျဉ်းချုပ် မရှိပါ။'}
                </p>
              </div>

              <div class="pt-3 border-t border-[#3b358c]/60">
                <a href="novels.html?id=${book.id}" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1 shadow">
                  <i class="fa-solid fa-book-open"></i> စာအုပ်ကြည့်ရန်
                </a>
              </div>
            </div>
          </div>
        `;
        booksContainer.insertAdjacentHTML('beforeend', cardHtml);
      });
    });
  </script>
</body>
</html>
