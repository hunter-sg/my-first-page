<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာအုပ်စင် - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#0f1021] text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#15162e] border-b border-[#2a2d54] p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-slate-950 font-bold shadow">
          <i class="fa-solid fa-book-open text-lg"></i>
        </div>
        <h1 class="text-xl font-bold text-amber-500 tracking-wide">စာပေဥယျာဉ်</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <div id="liveClock" class="bg-[#1a1c38] border border-[#2a2d54] text-amber-400 text-xs px-3 py-1.5 rounded-lg text-center font-mono">
          --:--:--
        </div>
        <button class="text-gray-300 hover:text-amber-500 text-xl">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid Section -->
  <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 flex-grow">
    <!-- Card Container (ဖုန်းမှာ ၂ ကွက်၊ Tablet မှာ ၃/၄ ကွက်၊ Desktop မှာ ၅ ကွက် ပြပါမည်) -->
    <div id="booksContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
      <!-- Loading Placeholder -->
      <div class="col-span-full text-center py-12 text-gray-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-amber-500"></i>
        <p class="text-sm">စာအုပ်များ ရယူနေပါသည်...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#15162e] border-t border-[#2a2d54] text-gray-500 text-center py-4 text-xs mt-auto">
    © 2026 Literature Garden. All rights reserved.
  </footer>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Live Clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString();
      const dateStr = now.toLocaleDateString();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) {
        clockEl.innerHTML = `${timeStr}<br>${dateStr}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Base Title ဖြတ်ထုတ်ရန် Helper
    function getBaseTitle(fullTitle) {
      if (!fullTitle) return '';
      let clean = fullTitle.trim();
      if (clean.toLowerCase().includes('shadow slave')) return 'shadow slave';
      if (clean.includes('ကောင်းကင်ဘုံကို')) return 'ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်';
      return clean.split(/::|-|\.\.|chapter/i)[0].trim().toLowerCase();
    }

    async function loadBooks() {
      const dbRef = ref(db);
      const container = document.getElementById('booksContainer');

      try {
        const snapshot = await get(child(dbRef, 'newnovels'));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const keys = Object.keys(data);

          // Group posts by Novel Title
          const booksMap = {};

          keys.forEach(key => {
            const item = data[key];
            const rawTitle = item.title || '';
            const baseTitle = getBaseTitle(rawTitle);
            const mainName = rawTitle.split(/::|-|\.\.|chapter/i)[0].trim() || rawTitle;

            if (!booksMap[baseTitle]) {
              booksMap[baseTitle] = {
                id: key,
                title: mainName,
                author: item.author || 'Hunter',
                summary: item.summary || item.description || '',
                coverUrl: item.image || item.imageUrl || item.img || item.cover || '',
                latestChapter: rawTitle.split(/::|-|\.\./)[1]?.trim() || ''
              };
            } else {
              // ပုံမရှိသေးပါက နောက်အခန်းများမှ ပုံရှာယူမည်
              if (!booksMap[baseTitle].coverUrl && (item.image || item.imageUrl || item.img || item.cover)) {
                booksMap[baseTitle].coverUrl = item.image || item.imageUrl || item.img || item.cover;
              }
              if (!booksMap[baseTitle].summary && (item.summary || item.description)) {
                booksMap[baseTitle].summary = item.summary || item.description;
              }
            }
          });

          container.innerHTML = ''; // Clear loading

          Object.values(booksMap).forEach(book => {
            const coverImage = book.coverUrl || 'https://via.placeholder.com/200x300?text=No+Cover';
            const summaryText = book.summary || 'အကြောင်းအရာ ဖော်ပြချက် မရှိသေးပါ။';

            const cardHtml = `
              <div class="bg-[#1a1c38] border border-[#2a2d54] rounded-xl overflow-hidden shadow-md flex flex-col justify-between hover:border-amber-500/50 transition">
                
                <!-- Novel Cover Image -->
                <div class="relative w-full aspect-[2/3] overflow-hidden bg-slate-800">
                  <img src="${coverImage}" alt="${book.title}" class="w-full h-full object-cover">
                  ${book.latestChapter ? `
                    <span class="absolute top-1.5 right-1.5 bg-amber-500 text-slate-950 font-bold text-[10px] px-2 py-0.5 rounded-full shadow">
                      ${book.latestChapter}
                    </span>
                  ` : ''}
                </div>

                <!-- Info Details -->
                <div class="p-2.5 sm:p-3 flex flex-col flex-grow justify-between gap-2">
                  <div>
                    <h3 class="text-amber-400 font-bold text-xs sm:text-sm line-clamp-1 mb-1" title="${book.title}">
                      ${book.title}
                    </h3>
                    
                    <p class="text-gray-400 text-[10px] sm:text-[11px] flex items-center gap-1 mb-1.5">
                      <i class="fa-solid fa-feather text-amber-500"></i>
                      <span class="truncate">${book.author}</span>
                    </p>

                    <p class="text-gray-300 text-[10px] sm:text-[11px] line-clamp-2 leading-tight opacity-80">
                      ${summaryText}
                    </p>
                  </div>

                  <!-- Action Button -->
                  <div class="pt-2 border-t border-slate-700/50 mt-1">
                    <a href="novels.html?category=newnovels&id=${book.id}" 
                       class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-1.5 px-2 rounded-lg flex items-center justify-center gap-1.5 transition text-[11px] sm:text-xs shadow">
                      <i class="fa-solid fa-book-open"></i>
                      <span>စာအုပ်ကြည့်ရန်</span>
                    </a>
                  </div>
                </div>

              </div>
            `;

            container.insertAdjacentHTML('beforeend', cardHtml);
          });

        } else {
          container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">စာအုပ်များ မရှိသေးပါ။</div>';
        }
      } catch (err) {
        console.error("Error loading books:", err);
        container.innerHTML = '<div class="col-span-full text-center text-red-400 py-10">အချက်အလက်များ ဆွဲယူရာတွင် အမှားအယွင်းရှိနေပါသည်။</div>';
      }
    }

    loadBooks();
  </script>
</body>
</html>
