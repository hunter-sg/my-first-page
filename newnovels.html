<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Novel Detail - Literature Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-indigo-950 text-white min-h-screen">

  <!-- Breadcrumb -->
  <div class="max-w-4xl mx-auto px-4 py-3 text-xs text-gray-400 flex items-center space-x-2 border-b border-indigo-900">
    <a href="index.html" class="hover:text-amber-400"><i class="fa-solid fa-house"></i> Home</a>
    <span>&gt;</span>
    <a href="newnovels.html" class="hover:text-amber-400">Action</a>
    <span>&gt;</span>
    <span id="breadcrumbTitle" class="text-amber-400">Shadow Slave</span>
  </div>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Novel Info Section -->
    <div class="bg-indigo-900/40 rounded-xl border border-indigo-800/60 p-6 backdrop-blur">
      <div class="flex flex-col md:flex-row gap-6 items-center md:items-start">
        
        <!-- Cover Image Box -->
        <div class="w-48 flex-shrink-0 shadow-2xl rounded-lg overflow-hidden border-2 border-amber-400/40">
          <img id="novelCover" src="" alt="Novel Cover" class="w-full h-auto object-cover">
        </div>

        <!-- Meta Details -->
        <div class="flex-1 space-y-3 text-center md:text-left">
          <h1 id="novelTitle" class="text-2xl md:text-3xl font-extrabold text-amber-400"></h1>
          
          <div class="space-y-1.5 text-sm text-gray-300">
            <p><i class="fa-solid fa-user text-amber-400 w-5"></i> Author: <span id="novelAuthor" class="text-white"></span></p>
            <p><i class="fa-solid fa-tags text-amber-400 w-5"></i> Genre: <span id="novelGenre" class="text-white">Action, Fantasy</span></p>
            <p><i class="fa-solid fa-globe text-amber-400 w-5"></i> Type: <span class="text-white">Webnovel</span></p>
            <p><i class="fa-solid fa-clock text-amber-400 w-5"></i> Status: <span class="text-emerald-400 font-semibold">Ongoing</span></p>
          </div>

          <!-- Rating -->
          <div class="pt-2 flex items-center justify-center md:justify-start space-x-2">
            <div class="text-amber-400 text-lg">★★★★★</div>
            <span class="text-xs text-gray-400">(4.5 / 5 - 5512 votes)</span>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="mt-8 border-t border-indigo-800/80 pt-6">
        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2 mb-3">
          <i class="fa-solid fa-circle-info"></i> SUMMARY
        </h2>
        <p id="novelSummary" class="text-sm text-gray-300 leading-relaxed justify-start"></p>
      </div>

      <!-- Action Buttons -->
      <div class="mt-8 flex flex-wrap gap-4 justify-center">
        <a href="#chapterListSection" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 transition">
          <i class="fa-solid fa-list"></i> CHAPTER LIST
        </a>
        <a id="readFirstBtn" href="#" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 transition">
          <i class="fa-solid fa-circle-arrow-right"></i> READ FIRST
        </a>
      </div>
    </div>

    <!-- Chapter List Section -->
    <div id="chapterListSection" class="mt-8 bg-indigo-900/40 rounded-xl border border-indigo-800/60 p-6">
      <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2 mb-4">
        <i class="fa-solid fa-pen-to-square"></i> LATEST CHAPTERS
      </h2>
      
      <div id="chaptersContainer" class="divide-y divide-indigo-800/50">
        <!-- Chapters will be dynamically rendered here -->
      </div>
    </div>
  </main>

</body>
</html>
