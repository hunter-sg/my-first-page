<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ဝတ္ထုများ - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
    body { font-family: 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between gap-2">
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <img src="photo_2026-09-07_21-25-15.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-sm md:text-base font-bold tracking-wide">စာပေဥယျာဥ်</h1>
      </a>

      <!-- Search & Clock -->
      <div class="flex items-center gap-2 flex-1 max-w-xs md:max-w-md mx-2">
        <div class="relative w-full">
          <input type="text" id="searchInput" onkeyup="searchNovels()" placeholder="ဝတ္ထု ရှာဖွေရန်..." class="w-full bg-indigo-950/80 text-white placeholder-indigo-300 text-xs rounded-full pl-8 pr-3 py-1.5 border border-indigo-700/60 focus:outline-none focus:border-amber-400 transition">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-indigo-400 text-xs"></i>
        </div>
        <div class="bg-indigo-950/60 border border-indigo-800 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
          <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
          <span id="dateDisplay" class="font-medium">00/00/0000</span>
        </div>
      </div>

      <button id="menuBtn" class="text-white text-base focus:outline-none md:hidden">
        <i id="menuIcon" class="fa-solid fa-bars"></i>
      </button>

      <nav id="menuList" class="hidden md:flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-4 text-sm">
        <a href="index.html" class="px-3 py-2 text-white hover:text-amber-400">ပင်မ</a>
        <a href="knowledges.html" class="px-3 py-2 text-white hover:text-amber-400">သုတရသ</a>
        <a href="newnovels.html" class="px-3 py-2 text-amber-400 font-bold">ဝတ္ထု</a>
        <a href="sports.html" class="px-3 py-2 text-white hover:text-amber-400">အားကစား</a>
        <a href="poems.html" class="px-3 py-2 text-white hover:text-amber-400">ကဗျာ</a>
        <a href="submit.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
          <i class="fa-solid fa-pen-to-square"></i> စာမူတင်ရန်
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto my-6 px-4 flex-grow max-w-5xl">
    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-gray-100 mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
          <span class="p-2 bg-indigo-100 text-indigo-800 rounded-lg text-sm"><i class="fa-solid fa-book"></i></span>
          ဝတ္ထုစင် (Novel Library)
        </h2>
        <p class="text-xs text-gray-500 mt-1">တင်ဆက်ထားသော ဝတ္ထုရှည်များနှင့် အခန်းဆက်ဝတ္ထုများ</p>
      </div>
      <a href="submit.html" class="hidden sm:inline-flex items-center gap-1.5 bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-3.5 py-2 rounded-lg font-bold transition">
        <i class="fa-solid fa-plus"></i> ဝတ္ထုသစ်တင်ရန်
      </a>
    </div>

    <!-- Novel Grid Container -->
    <div id="novelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
      <div class="col-span-full text-center py-10 text-gray-400 text-xs">
        <i class="fa-solid fa-spinner fa-spin text-lg mr-2"></i> ဝတ္ထုများကို ရယူနေပါသည်...
      </div>
    </div>
  </main>

  <!-- Novel Detail & Interaction Modal -->
  <div id="novelModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div id="modalContent" class="w-full flex justify-center"></div>
  </div>

  <footer class="bg-indigo-950 text-indigo-200 py-4 text-center text-xs mt-10">
    <p>© 2026 စာပေဥယျာဉ်. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const novelsGrid = document.getElementById('novelsGrid');

    let allNovels = {};

    // Live Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
      document.getElementById('dateDisplay').textContent = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Mobile Menu
    const menuBtn = document.getElementById('menuBtn');
    const menuList = document.getElementById('menuList');
    if (menuBtn) {
      menuBtn.onclick = () => {
        menuList.classList.toggle('hidden');
        document.getElementById('menuIcon').className = menuList.classList.contains('hidden') ? "fa-solid fa-bars" : "fa-solid fa-xmark";
      };
    }

    // Load Novels from Firebase
    function loadNovels() {
      const novelsRef = ref(database, 'novels');
      onValue(novelsRef, (snapshot) => {
        novelsGrid.innerHTML = '';
        const data = snapshot.val();
        allNovels = data || {};

        if (!data) {
          novelsGrid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs">ဝတ္ထုများ မရှိသေးပါ။</div>`;
          return;
        }

        Object.entries(data).forEach(([id, novel]) => {
          const chapterCount = novel.chapters ? Object.keys(novel.chapters).length : 0;
          const likesCount = novel.likes || 0;
          const viewsCount = novel.views || 0;
          const coverImage = novel.coverImage 
            ? `<img src="${novel.coverImage}" class="w-full h-48 md:h-56 object-cover rounded-t-xl" />`
            : `<div class="w-full h-48 md:h-56 bg-indigo-100 flex items-center justify-center text-indigo-500 rounded-t-xl"><i class="fa-solid fa-book-open text-4xl"></i></div>`;

          novelsGrid.innerHTML += `
            <div onclick="openNovelModal('${id}')" class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:border-indigo-200 transition overflow-hidden flex flex-col justify-between group cursor-pointer">
              <div>
                <div class="relative overflow-hidden">
                  ${coverImage}
                  <span class="absolute top-2 right-2 bg-indigo-900/80 backdrop-blur-md text-amber-300 text-[10px] px-2 py-0.5 rounded-full font-bold">
                    ${chapterCount} အခန်း
                  </span>
                </div>
                <div class="p-3">
                  <h3 class="text-xs md:text-sm font-bold text-gray-800 line-clamp-1 group-hover:text-indigo-600 transition mb-1">${novel.title}</h3>
                  <p class="text-[11px] text-gray-500 line-clamp-2 mb-2">${novel.summary || 'အကျဉ်းချုပ် မရှိသေးပါ။'}</p>
                </div>
              </div>
              <div class="px-3 py-2 bg-gray-50 border-t border-gray-100 flex justify-between items-center text-[10px] text-gray-400">
                <span class="truncate">ရေးသူ - ${novel.author || 'မသိရပါ'}</span>
                <div class="flex items-center gap-2">
                  <span>👁️ ${viewsCount}</span>
                  <span>❤️ ${likesCount}</span>
                </div>
              </div>
            </div>
          `;
        });
      });
    }

    // Open Modal for Details, Likes, Views, and Comments
    window.openNovelModal = function(novelId) {
      const novel = allNovels[novelId];
      if (!novel) return;

      // Increment Views
      const novelRef = ref(database, `novels/${novelId}`);
      runTransaction(novelRef, (n) => {
        if (n) {
          n.views = (n.views || 0) + 1;
        }
        return n;
      });

      const modalContainer = document.getElementById('novelModal');
      const modalContent = document.getElementById('modalContent');

      // Render Comments
      let commentsHtml = '';
      if (novel.comments && Object.keys(novel.comments).length > 0) {
        Object.values(novel.comments).forEach(c => {
          commentsHtml += `
            <div class="bg-gray-100/70 p-2.5 rounded-lg text-xs space-y-0.5">
              <div class="flex justify-between font-bold text-indigo-950 text-[11px]">
                <span>${c.name || 'ဧည့်သည်'}</span>
                <span class="text-gray-400 text-[10px] font-normal">${c.date || ''}</span>
              </div>
              <p class="text-gray-700">${c.text}</p>
            </div>
          `;
        });
      } else {
        commentsHtml = `<p class="text-[11px] text-gray-400 text-center py-2">မှတ်ချက်များ မရှိသေးပါ။</p>`;
      }

      const coverHtml = novel.coverImage 
        ? `<img src="${novel.coverImage}" class="w-28 h-36 object-cover rounded-lg border border-gray-100 shadow-sm flex-shrink-0" />`
        : `<div class="w-28 h-36 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-500 flex-shrink-0"><i class="fa-solid fa-book-open text-3xl"></i></div>`;

      modalContent.innerHTML = `
        <div class="bg-white rounded-2xl max-w-2xl w-full h-[90vh] flex flex-col overflow-hidden">
          <!-- Header -->
          <div class="bg-indigo-50/70 px-4 py-3 border-b border-indigo-100 flex justify-between items-start flex-shrink-0">
            <div>
              <h2 class="text-sm md:text-base font-bold text-gray-800">${novel.title}</h2>
              <p class="text-[11px] text-indigo-600 font-semibold">ရေးသားသူ - ${novel.author || 'မသိရပါ'}</p>
            </div>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-lg p-1 transition flex-shrink-0">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Body -->
          <div class="p-4 md:p-5 overflow-y-auto space-y-4 flex-grow">
            <div class="flex gap-4 items-start">
              ${coverHtml}
              <div class="space-y-2 flex-grow">
                <p class="text-xs text-gray-600 leading-relaxed">${novel.summary || 'အကျဉ်းချုပ် မရှိသေးပါ။'}</p>
                <div class="flex items-center gap-4 text-xs text-gray-500 pt-2">
                  <span>👁️ <span id="viewCount">${(novel.views || 0) + 1}</span> ကြည့်ရှုသူ</span>
                  <button onclick="likeNovel('${novelId}')" class="flex items-center gap-1 hover:text-red-500 text-red-600 font-semibold transition bg-red-50 px-2 py-0.5 rounded-full border border-red-100">
                    ❤️ <span id="likeCount">${novel.likes || 0}</span> သဘောကျသည်
                  </button>
                </div>
                <div class="pt-2">
                  <a href="novels.html?id=${novelId}" class="inline-flex items-center gap-1.5 bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-4 py-2 rounded-lg font-bold transition">
                    <i class="fa-solid fa-book-open"></i> ဝတ္ထုဖတ်ရှုရန်
                  </a>
                </div>
              </div>
            </div>

            <!-- Comments Section -->
            <div class="border-t border-gray-100 pt-3 space-y-3">
              <h4 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                <i class="fa-regular fa-comments text-indigo-600"></i> မှတ်ချက်များ
              </h4>

              <!-- Comment Form -->
              <div class="space-y-2 bg-indigo-50/40 p-3 rounded-xl border border-indigo-50">
                <input type="text" id="commentName" placeholder="သင့်နာမည် ရေးပါ..." class="w-full text-xs p-2 rounded-lg border border-gray-200 outline-none focus:ring-1 focus:ring-indigo-500">
                <textarea id="commentText" rows="2" placeholder="မှတ်ချက် ရေးရန်..." class="w-full text-xs p-2 rounded-lg border border-gray-200 outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                <button onclick="addNovelComment('${novelId}')" class="bg-indigo-900 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold hover:bg-indigo-800 transition float-right">
                  မှတ်ချက် ပို့မည်
                </button>
                <div class="clear-both"></div>
              </div>

              <!-- Comment List -->
              <div class="space-y-2 mt-2">
                ${commentsHtml}
              </div>
            </div>
          </div>

          <!-- Footer -->
          <div class="px-4 py-2.5 bg-gray-50 border-t border-gray-100 flex justify-end flex-shrink-0">
            <button onclick="closeModal()" class="bg-indigo-900 hover:bg-indigo-800 text-white text-xs px-5 py-2 rounded-lg font-bold transition">
              ပိတ်မည်
            </button>
          </div>
        </div>
      `;

      modalContainer.classList.remove('hidden');
      modalContainer.classList.add('flex');
    };

    // Like Novel Function
    window.likeNovel = async function(novelId) {
      try {
        const novelRef = ref(database, `novels/${novelId}`);
        await runTransaction(novelRef, (novel) => {
          if (novel) {
            novel.likes = (novel.likes || 0) + 1;
          }
          return novel;
        });

        const likeElem = document.getElementById('likeCount');
        if (likeElem) {
          likeElem.textContent = parseInt(likeElem.textContent || 0) + 1;
        }
      } catch (err) {
        console.error("Like ပေး၍ မရပါ: ", err);
      }
    };

    // Add Comment Function
    window.addNovelComment = async function(novelId) {
      const nameInput = document.getElementById('commentName');
      const textInput = document.getElementById('commentText');

      if (!textInput.value.trim()) {
        alert("မှတ်ချက် စာသား ရေးပေးပါ!");
        return;
      }

      const commentData = {
        name: nameInput.value.trim() || 'ဧည့်သည်',
        text: textInput.value.trim(),
        date: new Date().toLocaleDateString('en-GB')
      };

      try {
        await push(ref(database, `novels/${novelId}/comments`), commentData);
        alert("မှတ်ချက် တင်ပြီးပါပြီ!");
        closeModal();
      } catch (err) {
        alert("မှတ်ချက် တင်၍ မရပါ: " + err.message);
      }
    };

    // Close Modal
    window.closeModal = function() {
      const modalContainer = document.getElementById('novelModal');
      if (modalContainer) {
        modalContainer.classList.add('hidden');
        modalContainer.classList.remove('flex');
      }
    };

    // Search
    window.searchNovels = function() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = novelsGrid.querySelectorAll('#novelsGrid > div');
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
      });
    };

    loadNovels();
  </script>
</body>
</html>
