<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အခန်း ၁ - ကောင်းကင် ကမ္ဘာ</title>
    <!-- Font Awesome Icons အတွက် CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }

        /* Top Header Breadcrumb Style */
        .breadcrumb {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 30px;
        }

        .breadcrumb a {
            color: #555;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .breadcrumb a:hover {
            color: #0b4b6f;
        }

        .breadcrumb .separator {
            margin: 0 8px;
            color: #888;
        }

        .breadcrumb .current {
            color: #666;
        }

        /* Chapter Main Content Style */
        .chapter-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .chapter-header {
            text-align: right; /* ပုံအတိုင်း ညာဘက်ကပ်လိုပါက right ထားပါ (သို့) center ထားနိုင်ပါသည် */
            margin-bottom: 25px;
        }

        .novel-title {
            color: #3e7b9d;
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .chapter-title {
            color: #444;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Navigation Buttons Style */
        .nav-buttons {
            display: flex;
            justify-content: flex-end; /* ညာဘက်သို့ ကပ်ရန် */
            align-items: center;
            gap: 4px;
        }

        .btn {
            background-color: #0d4663;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #082d40;
        }

        .btn-icon {
            padding: 8px 12px;
        }

        /* Reading Text Content */
        .chapter-body {
            margin-top: 40px;
            line-height: 1.8;
            font-size: 16px;
            color: #222;
        }
    </style>
</head>
<body>

    <!-- Header / Breadcrumb Section -->
    <nav class="breadcrumb">
        <a href="#"><i class="fa-solid fa-house"></i> Home</a>
        <span class="separator">›</span>
        <a href="#">ကောင်းကင်ဘုံကို ဓါးပြတိုက်မယ်</a>
        <span class="separator">›</span>
        <span class="current">အခန်း ၁ - ကောင်းကင် ကမ္ဘာ</span>
    </nav>

    <!-- Main Content Section -->
    <div class="chapter-container">
        
        <div class="chapter-header">
            <!-- စာအုပ် Title -->
            <h1 class="novel-title">ကောင်းကင်ဘုံကို ဓါးပြတိုက်မယ်</h1>
            
            <!-- အခန်း Title -->
            <h2 class="chapter-title">အခန်း ၁ - ကောင်းကင် ကမ္ဘာ</h2>
            
            <!-- Navigation Buttons -->
            <div class="nav-buttons">
                <a href="#" class="btn"><i class="fa-solid fa-angle-left"></i> ရှေ့ အခန်း</a>
                <a href="#" class="btn btn-icon" title="အခန်းဇယား"><i class="fa-solid fa-list-ul"></i></a>
                <a href="#" class="btn">နောက်အခန်း <i class="fa-solid fa-angle-right"></i></a>
            </div>
        </div>

        <!-- အခန်းစာပိုဒ်များ -->
        <article class="chapter-body">
            <p>ဒီနေရာမှာ စာဖတ်သူများ ဖတ်ရှုရန် စာပိုဒ်များကို ထည့်သွင်းနိုင်ပါသည်။...</p>
        </article>

    </div>

</body>
</html>
