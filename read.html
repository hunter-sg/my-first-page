<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာမူဖတ်ရန် - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
    body { font-family: 'Padauk', sans-serif; }

    /* စာကိုယ်အတွင်းမှ ပုံများကို Size သေးအောင် ထိန်းပေးမည့် CSS */
    .chapter-content img {
      max-width: 280px !important;
      height: auto !important;
      margin: 12px auto !important;
      display: block !important;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-2 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="photo_2026-09-07_21-25-15.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-amber-400/50 object-cover">
        <h1 class="text-sm md:text-base font-bold">စာပေဥယျာဥ်</h1>
      </a>
      <button onclick="history.back()" class="text-amber-400 text-xs flex items-center gap-1 font-semibold hover:underline">
        <i class="fa-solid fa-arrow-left"></i> နောက်သို့
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto my-6 px-4 flex-grow max-w-3xl">
    <!-- Loading Spinner -->
    <div id="loading" class="text-center py-20 text-gray-400 text-sm">
      <i class="fa-solid fa-spinner fa-spin text-xl mr-2"></i> စာမူကို ရယူနေပါသည်...
    </div>

    <!-- Article Main Container -->
    <article id="postDetails" class="hidden bg-white rounded-2xl p-5 md:p-8 shadow-sm border border-gray-100 space-y-6">
      
      <!-- ၁။ နိဒါန်းပိုင်း (Intro & Summary Section) -->
      <div id="introSection" class="space-y-6">
        <div class="border-b border-gray-100 pb-4">
          <h1 id="postTitle" class="text-lg md:text-2xl font-bold text-gray-800 mb-2"></h1>
          <div class="flex items-center gap-3 text-xs text-gray-500">
            <span>ရေးသားသူ - <strong id="postAuthor" class="text-indigo-600"></strong></span>
            <span>•</span>
            <span id="postDate"></span>
          </div>
        </div>

        <div id="coverImageContainer" class="hidden text-center">
          <img id="postCoverImage" class="max-h-80 mx-auto object-contain rounded-xl border border-gray-100 shadow-sm" src="" alt="Cover">
        </div>

        <div id="postContent" class="text-xs md:text-sm text-gray-700 leading-relaxed md:leading-loose space-y-4"></div>
      </div>

      <!-- ၂။ အခန်းများ စာရင်း (Chapters List) -->
      <div id="chaptersContainer" class="hidden space-y-4 border-t border-gray-100 pt-6">
        <h3 class="text-sm md:text-base font-bold text-indigo-900 flex items-center gap-2">
          <i class="fa-solid fa-list-ol text-amber-500"></i> အခန်းများ စာရင်း
        </h3>
        <div id="chaptersList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

    </article>
  </main>

  <!-- Pop-up / Modal ပုံစံဖြင့် စာဖတ်ရန် Active Chapter Modal Box (အထပ်အောက် အမြင့် ၃ ပုံ ၁ ပုံခန့် ချုံ့ထားသည်) -->
  <div id="activeChapterBox" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-2 sm:p-4 transition-all">
    <div class="bg-white rounded-2xl w-full max-w-5xl h-[92vh] flex flex-col shadow-2xl border border-amber-200 overflow-hidden animate-in fade-in zoom-in duration-200">
      
      <!-- Modal Header (အမြင့် ချုံ့ထားသည်) -->
      <div class="flex justify-between items-center bg-indigo-900 text-white px-3 md:px-5 py-1.5 border-b border-indigo-800 shrink-0">
        <h3 id="activeChapterTitle" class="font-bold text-xs md:text-sm text-amber-400 truncate pr-2"></h3>
        <button onclick="closeChapterView()" class="text-[11px] bg-indigo-800 hover:bg-indigo-700 text-gray-200 px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 shrink-0">
          <i class="fa-solid fa-xmark"></i> ပိတ်မည်
        </button>
      </div>
      
      <!-- Modal Content Area (Scrollable) -->
      <div id="modalScrollBody" class="p-4 md:p-8 overflow-y-auto flex-grow bg-amber-50/20">
        <div id="activeChapterContent" class="chapter-content text-sm md:text-base text-gray-800 leading-relaxed md:leading-loose whitespace-pre-line max-w-3xl mx-auto"></div>
      </div>

      <!-- Modal Footer Navigation (အမြင့်နှင့် ခလုတ်အလိုက် ချုံ့ထားသည်) -->
      <div class="bg-indigo-950 border-t border-indigo-900 px-3 md:px-5 py-1.5 flex items-center justify-between gap-2 shrink-0 text-white">
        <!-- Previous Button -->
        <button id="prevChapterBtn" onclick="navigateChapter(-1)" class="text-xs bg-indigo-800 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1 font-semibold">
          <i class="fa-solid fa-chevron-left"></i> <span class="hidden sm:inline">ယခင်အခန်း</span>
        </button>

        <!-- Chapter Select Dropdown -->
        <div class="flex-grow max-w-xs sm:max-w-md">
          <select id="chapterSelect" onchange="onSelectChapter(this.value)" class="w-full bg-indigo-900 text-amber-300 border border-indigo-700 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-amber-400 text-center font-bold">
          </select>
        </div>

        <!-- Next Button -->
        <button id="nextChapterBtn" onclick="navigateChapter(1)" class="text-xs bg-indigo-800 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1 font-semibold">
          <span class="hidden sm:inline">နောက်အခန်း</span> <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

    </div>
  </div>

  <footer class="bg-indigo-950 text-indigo-200 py-4 text-center text-xs mt-10">
    <p>© 2026 စာပေဥယျာဉ်. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoDzQF0OUpI0EaHmoS_41bfBD3qyQIQp4",
      authDomain: "my-first-page-240a0.firebaseapp.com",
      databaseURL: "https://my-first-page-240a0-default-rtdb.firebaseio.com",
      projectId: "my-first-page-240a0",
      storageBucket: "my-first-page-240a0.firebasestorage.app",
      messagingSenderId: "783682491493",
      appId: "1:783682491493:web:27e1d4f925e14c60a2a28c"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    const postType = urlParams.get('type') || 'novels';

    let globalChapters = {};
    let chapterKeysArray = []; // အခန်း ID စာရင်း
    let currentChapterIndex = -1; // လက်ရှိဖတ်နေသော အခန်း၏ အစဉ်လိုက်နေရာ (Index)

    if (!postId) {
      alert("စာမူ လမ်းကြောင်း မှားယွင်းနေပါသည်။");
      window.location.href = "index.html";
    } else {
      onValue(ref(database, `${postType}/${postId}`), (snapshot) => {
        const post = snapshot.val();
        document.getElementById('loading').classList.add('hidden');

        if (!post) {
          alert("စာမူ ရှာမတွေ့ပါ။");
          return;
        }

        document.getElementById('postDetails').classList.remove('hidden');
        document.getElementById('postTitle').innerText = post.title || post.bookTitle || 'ခေါင်းစဉ်မရှိ';
        document.getElementById('postAuthor').innerText = post.author || 'မသိရပါ';
        document.getElementById('postDate').innerText = post.date || '';

        const coverImg = post.coverImage || post.image || post.imageUrl || post.img;
        if (coverImg) {
          document.getElementById('postCoverImage').src = coverImg;
          document.getElementById('coverImageContainer').classList.remove('hidden');
        }

        const mainContent = post.content || post.summary || '';
        document.getElementById('postContent').innerHTML = mainContent ? `<p class="whitespace-pre-line">${mainContent}</p>` : '';

        const chaptersContainer = document.getElementById('chaptersContainer');
        const chaptersList = document.getElementById('chaptersList');
        const chapterSelect = document.getElementById('chapterSelect');

        if (post.chapters && Object.keys(post.chapters).length > 0) {
          globalChapters = post.chapters;
          chapterKeysArray = Object.keys(post.chapters); // Keys များထုတ်ယူမည်
          
          chaptersList.innerHTML = '';
          chapterSelect.innerHTML = '';

          chapterKeysArray.forEach((chId, index) => {
            const chVal = globalChapters[chId];
            const rawTitle = chVal.title || chVal.chapterTitle || chVal.name || '';
            const chTitle = rawTitle ? `အခန်း (${index + 1}) - ${rawTitle}` : `အခန်း (${index + 1})`;

            // အခန်းများ စာရင်း ခလုတ်များ
            chaptersList.innerHTML += `
              <button onclick="readChapterByIndex(${index})" class="p-3 bg-white hover:bg-indigo-50 rounded-xl border border-gray-100 shadow-sm cursor-pointer flex items-center justify-between text-gray-800 font-bold text-xs md:text-sm transition w-full">
                <span class="font-bold text-xs md:text-sm text-gray-800">${chTitle}</span>
                <i class="fa-solid fa-book-open-reader text-xs text-indigo-500"></i>
              </button>
            `;

            // Footer ရှိ Dropdown Options များ
            chapterSelect.innerHTML += `<option value="${index}">${chTitle}</option>`;
          });
          chaptersContainer.classList.remove('hidden');
        } else {
          chaptersContainer.classList.add('hidden');
        }
      });
    }

    // Index ဖြင့် အခန်းကို ဖတ်ရှုရန် Function
    window.readChapterByIndex = function(index) {
      if (index < 0 || index >= chapterKeysArray.length) return;

      currentChapterIndex = index;
      const chId = chapterKeysArray[index];
      const chapterData = globalChapters[chId];
      if (!chapterData) return;

      const rawTitle = chapterData.title || chapterData.chapterTitle || chapterData.name || '';
      const chTitle = rawTitle ? `အခန်း (${index + 1}) - ${rawTitle}` : `အခန်း (${index + 1})`;

      document.getElementById('activeChapterTitle').innerText = chTitle;

      const contentText = chapterData.content || chapterData.text || 'စာသား မရှိသေးပါ။';
      document.getElementById('activeChapterContent').innerHTML = contentText;

      // Dropdown တန်ဖိုး ပြောင်းပေးမည်
      document.getElementById('chapterSelect').value = index;

      // Prev/Next ခလုတ်များကို အခြေအနေပေါ်မူတည်၍ Disable/Enable ပြုလုပ်မည်
      document.getElementById('prevChapterBtn').disabled = (index === 0);
      document.getElementById('nextChapterBtn').disabled = (index === chapterKeysArray.length - 1);

      // Scroll ကို အပေါ်ဆုံး ပြန်တင်မည်
      document.getElementById('modalScrollBody').scrollTop = 0;

      // Modal ပြမည်
      document.getElementById('activeChapterBox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    };

    // ရှေ့/နောက် ခလုတ်များ နှိပ်သည့်အခါ အလုပ်လုပ်မည့် Function
    window.navigateChapter = function(direction) {
      const newIndex = currentChapterIndex + direction;
      if (newIndex >= 0 && newIndex < chapterKeysArray.length) {
        readChapterByIndex(newIndex);
      }
    };

    // Dropdown မူပြောင်းသည့်အခါ အလုပ်လုပ်မည့် Function
    window.onSelectChapter = function(value) {
      readChapterByIndex(parseInt(value, 10));
    };

    // Pop-up ကို ပိတ်လိုက်လျှင်
    window.closeChapterView = function() {
      document.getElementById('activeChapterBox').classList.add('hidden');
      document.body.style.overflow = 'auto';
    };
  </script>
</body>
</html>
