<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Chapter - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Select Dropdown အတွက် Custom Styling (ပုံပါ Design အတိုင်း ပုံဖော်ထားခြင်း) */
    .custom-select {
      background-color: #1e3a5f;
      color: #ffffff;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      background-size: 1.2em;
      padding-right: 2rem;
    }
    .custom-select option {
      background-color: #1e3a5f;
      color: #ffffff;
      padding: 10px;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-book-bookmark text-amber-400"></i> စာပေဥယျာဥ်
    </a>
    <a href="index.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition">
      <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
    </a>
  </header>

  <main class="container mx-auto max-w-3xl my-6 px-4 flex-grow">
    
    <!-- Breadcrumb Navigation -->
    <nav class="flex items-center gap-2 text-xs text-gray-500 mb-6 flex-wrap">
      <a href="index.html" class="hover:text-indigo-600"><i class="fa-solid fa-house"></i> Home</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <a id="backToNovel" href="#" class="hover:text-indigo-600 font-medium">ဝတ္ထုစာမျက်နှာ</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <span id="breadChapter" class="text-gray-700 font-semibold truncate">Chapter</span>
    </nav>

    <!-- Reading Title Area -->
    <div class="text-center mb-6">
      <h1 id="bookMainTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">...</h1>
      <h2 id="chapterSubTitle" class="text-sm md:text-base text-gray-600 font-medium">...</h2>
    </div>

    <!-- Top Navigation Buttons Bar -->
    <div class="flex justify-center items-center gap-1.5 sm:gap-2 mb-8">
      <a id="prevBtn" href="#" class="bg-slate-500 hover:bg-slate-600 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded shadow transition hidden flex items-center gap-1">
        <i class="fa-solid fa-chevron-left text-xs"></i> Prev Chapter
      </a>

      <!-- Chapter Dropdown Select Menu (Top) -->
      <select id="chapterSelectTop" class="custom-select text-xs sm:text-sm font-semibold py-2 px-3 rounded shadow outline-none cursor-pointer max-w-[180px] sm:max-w-[280px] truncate">
        <option value="">Loading Chapters...</option>
      </select>

      <a id="nextBtn" href="#" class="bg-[#1e3a5f] hover:bg-[#152a45] text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded shadow transition hidden flex items-center gap-1">
        Next Chapter <i class="fa-solid fa-chevron-right text-xs"></i>
      </a>
    </div>

    <div class="text-center my-4 text-gray-400">~ § ~</div>

    <!-- Content Card Box -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-8">
      <h3 id="contentHeaderTitle" class="text-lg md:text-xl font-bold text-gray-900 mb-6 border-b border-gray-100 pb-4">
        ...
      </h3>
      
      <!-- Content Text -->
      <div id="chapterContent" class="text-sm md:text-base text-gray-700 leading-relaxed space-y-4 whitespace-pre-line">
        <div class="text-center py-8 text-gray-400">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i> စာဖတ်ရန် ပြင်ဆင်နေပါသည်...
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Buttons Bar (Box ရဲ့ အပြင်ဘက် - အောက်ခြေ) -->
    <div class="flex justify-center items-center gap-1.5 sm:gap-2 mb-12">
      <a id="bottomPrevBtn" href="#" class="bg-slate-500 hover:bg-slate-600 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded shadow transition hidden flex items-center gap-1">
        <i class="fa-solid fa-chevron-left text-xs"></i> Prev Chapter
      </a>

      <!-- Chapter Dropdown Select Menu (Bottom) -->
      <select id="chapterSelectBottom" class="custom-select text-xs sm:text-sm font-semibold py-2 px-3 rounded shadow outline-none cursor-pointer max-w-[180px] sm:max-w-[280px] truncate">
        <option value="">Loading Chapters...</option>
      </select>

      <a id="bottomNextBtn" href="#" class="bg-[#1e3a5f] hover:bg-[#152a45] text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded shadow transition hidden flex items-center gap-1">
        Next Chapter <i class="fa-solid fa-chevron-right text-xs"></i>
      </a>
    </div>

  </main>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category') || 'newnovels';
    const currentId = urlParams.get('id');

    // စာအုပ်အမည်ကို စစ်ထုတ်ပေးသည့် Helper Function
    function getBaseTitle(fullTitle) {
      if (!fullTitle) return '';
      let clean = fullTitle.trim();
      if (clean.toLowerCase().includes('shadow slave')) return 'shadow slave';
      if (clean.includes('ကောင်းကင်ဘုံကို')) return 'ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်';
      return clean.split(/::|-|\.\.|chapter/i)[0].trim().toLowerCase();
    }

    async function loadChapter() {
      if (!currentId) return;

      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, category));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const allKeys = Object.keys(data);
          const currentPost = data[currentId];

          if (currentPost) {
            const rawTitle = currentPost.title || '';
            const targetBaseName = getBaseTitle(rawTitle);

            // ၁။ ပင်မ စာအုပ်အမည် ခွဲထုတ်ခြင်း
            let mainBookTitle = rawTitle.split(/::|-|\.\.|chapter/i)[0].trim();
            
            // ၂။ Chapter နာမည်သီးသန့် ခွဲထုတ်ခြင်း
            let chapterOnlyTitle = rawTitle;
            if (rawTitle.toLowerCase().includes(mainBookTitle.toLowerCase())) {
              chapterOnlyTitle = rawTitle.replace(new RegExp(mainBookTitle, 'gi'), '').trim();
              chapterOnlyTitle = chapterOnlyTitle.replace(/^[:\-\s]+/, '').trim();
            }
            if (!chapterOnlyTitle) chapterOnlyTitle = rawTitle;

            // UI တွင် တင်ဆက်ခြင်း
            document.getElementById('bookMainTitle').textContent = mainBookTitle;
            document.getElementById('chapterSubTitle').textContent = chapterOnlyTitle;
            document.getElementById('contentHeaderTitle').textContent = chapterOnlyTitle;
            document.getElementById('breadChapter').textContent = chapterOnlyTitle;
            document.getElementById('chapterContent').textContent = currentPost.content || currentPost.summary || 'စာဖတ်ရန် အကြောင်းအရာ မရှိသေးပါ။';

            // Back to Novel Link
            const novelUrl = `novels.html?category=${category}&id=${currentId}`;
            const backToNovel = document.getElementById('backToNovel');
            backToNovel.href = novelUrl;
            backToNovel.textContent = mainBookTitle;

            // ၃။ တူညီသော စာအုပ်အမည်ရှိသည့် Chapter များကို စစ်ထုတ်ခြင်း
            const filteredKeys = allKeys.filter(key => {
              const itemTitle = data[key].title || '';
              return getBaseTitle(itemTitle) === targetBaseName;
            });

            // ၄။ Select Menu (Dropdown) ထဲသို့ Chapter များ ဖြည့်သွင်းခြင်း
            const selectTop = document.getElementById('chapterSelectTop');
            const selectBottom = document.getElementById('chapterSelectBottom');
            
            selectTop.innerHTML = '';
            selectBottom.innerHTML = '';

            filteredKeys.forEach(key => {
              const item = data[key];
              
              // Chapter ခေါင်းစဉ်သီးသန့် ရယူခြင်း
              let optTitle = item.title || key;
              if (optTitle.toLowerCase().includes(mainBookTitle.toLowerCase())) {
                optTitle = optTitle.replace(new RegExp(mainBookTitle, 'gi'), '').trim();
                optTitle = optTitle.replace(/^[:\-\s]+/, '').trim();
              }
              if (!optTitle) optTitle = item.title;

              // Top Option
              const optTop = document.createElement('option');
              optTop.value = key;
              optTop.textContent = optTitle;
              if (key === currentId) optTop.selected = true;

              // Bottom Option
              const optBottom = document.createElement('option');
              optBottom.value = key;
              optBottom.textContent = optTitle;
              if (key === currentId) optBottom.selected = true;

              selectTop.appendChild(optTop);
              selectBottom.appendChild(optBottom);
            });

            // Dropdown မှ အခန်းတစ်ခုခု ရွေးလိုက်ပါက အခန်းသစ်သို့ သွားမည်
            const handleSelectChange = (e) => {
              const selectedKey = e.target.value;
              if (selectedKey) {
                window.location.href = `read.html?category=${category}&id=${selectedKey}`;
              }
            };
            selectTop.onchange = handleSelectChange;
            selectBottom.onchange = handleSelectChange;

            // ၅။ Prev & Next Chapter Navigation Logic
            const currentIndex = filteredKeys.indexOf(currentId);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const bottomPrevBtn = document.getElementById('bottomPrevBtn');
            const bottomNextBtn = document.getElementById('bottomNextBtn');

            // Previous Chapter (ရှိပါက ပြမည်)
            if (currentIndex > 0) {
              const prevUrl = `read.html?category=${category}&id=${filteredKeys[currentIndex - 1]}`;
              prevBtn.href = prevUrl;
              prevBtn.classList.remove('hidden');
              bottomPrevBtn.href = prevUrl;
              bottomPrevBtn.classList.remove('hidden');
            } else {
              prevBtn.classList.add('hidden');
              bottomPrevBtn.classList.add('hidden');
            }

            // Next Chapter (ရှိပါက ပြမည်)
            if (currentIndex !== -1 && currentIndex < filteredKeys.length - 1) {
              const nextUrl = `read.html?category=${category}&id=${filteredKeys[currentIndex + 1]}`;
              nextBtn.href = nextUrl;
              nextBtn.classList.remove('hidden');
              bottomNextBtn.href = nextUrl;
              bottomNextBtn.classList.remove('hidden');
            } else {
              nextBtn.classList.add('hidden');
              bottomNextBtn.classList.add('hidden');
            }
          }
        }
      } catch (err) {
        console.error("Read Chapter Error:", err);
      }
    }

    loadChapter();
  </script>
</body>
</html>
