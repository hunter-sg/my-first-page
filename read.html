<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Chapter - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-book-bookmark text-amber-400"></i> စာပေဥယျာဥ်
    </a>
    <a href="index.html" class="text-xs bg-indigo-950 px-3 py-1.5 rounded-lg hover:text-amber-400 transition">
      <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
    </a>
  </header>

  <main class="container mx-auto max-w-3xl my-6 px-4 flex-grow">
    
    <!-- Breadcrumb Navigation -->
    <nav class="flex items-center gap-2 text-xs text-gray-500 mb-6">
      <a href="index.html" class="hover:text-indigo-600"><i class="fa-solid fa-house"></i> Home</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <a id="backToNovel" href="#" class="hover:text-indigo-600 font-medium">ဝတ္ထုစာမျက်နှာ</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <span id="breadChapter" class="text-gray-700 font-semibold truncate">Chapter</span>
    </nav>

    <!-- Reading Title Area -->
    <div class="text-center mb-6">
      <!-- စာအုပ် ခေါင်းစဉ်အဓိက (အလိုအလျောက် ပြောင်းမည်) -->
      <h1 id="bookMainTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">...</h1>
      <!-- Chapter ခေါင်းစဉ် -->
      <h2 id="chapterSubTitle" class="text-sm md:text-base text-gray-600 font-medium">...</h2>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex justify-center items-center gap-3 mb-8">
      <a id="prevBtn" href="#" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-lg transition hidden">
        <i class="fa-solid fa-chevron-left mr-1"></i> Prev Chapter
      </a>
      <a id="novelListBtn" href="#" class="bg-slate-800 hover:bg-slate-900 text-white p-2.5 rounded-lg transition" title="Chapter List">
        <i class="fa-solid fa-list text-xs"></i>
      </a>
      <a id="nextBtn" href="#" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-lg transition hidden">
        Next Chapter <i class="fa-solid fa-chevron-right ml-1"></i>
      </a>
    </div>

    <div class="text-center my-4 text-gray-400">~ § ~</div>

    <!-- Content Card Box -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-8">
      <h3 id="contentHeaderTitle" class="text-lg md:text-xl font-bold text-gray-900 mb-6 border-b border-gray-100 pb-4">
        ...
      </h3>
      
      <!-- Content Text -->
      <div id="chapterContent" class="text-sm md:text-base text-gray-700 leading-relaxed space-y-4 whitespace-pre-line">
        <div class="text-center py-8 text-gray-400">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i> စာဖတ်ရန် ပြင်ဆင်နေပါသည်...
        </div>
      </div>
    </div>

  </main>

  <!-- Firebase Logic -->
  <script type="module">
    async function loadChapter() {
      if (!currentId) return;

      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, category));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const keys = Object.keys(data);
          const currentPost = data[currentId];

          if (currentPost) {
            const rawTitle = currentPost.title || '';
            
            // ၁။ ပင်မ စာအုပ်အမည်ကို ခွဲထုတ်ခြင်း (ဥပမာ - ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်)
            let mainBookTitle = rawTitle.split(/::|-|\.\.|chapter/i)[0].trim();
            
            // ၂။ Chapter နာမည်သီးသန့် ရရှိရန် စာအုပ်အမည်ကို ရှေ့ကနေ ဖယ်ထုတ်ခြင်း
            let chapterOnlyTitle = rawTitle;
            if (rawTitle.toLowerCase().includes(mainBookTitle.toLowerCase())) {
              chapterOnlyTitle = rawTitle.replace(new RegExp(mainBookTitle, 'gi'), '').trim();
              // ရှေ့မှာ ကျန်ခဲ့သော : သို့မဟုတ် - သို့မဟုတ် Space များကို ရှင်းထုတ်ခြင်း
              chapterOnlyTitle = chapterOnlyTitle.replace(/^[:\-\s]+/, '').trim();
            }

            // အကယ်၍ ခွဲထုတ်လိုက်လို့ အလွတ်ဖြစ်သွားပါက မူလ rawTitle အတိုင်း ထားမည်
            if (!chapterOnlyTitle) {
              chapterOnlyTitle = rawTitle;
            }

            // UI တွင် တင်ဆက်ခြင်း
            document.getElementById('bookMainTitle').textContent = mainBookTitle; // ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်
            document.getElementById('chapterSubTitle').textContent = chapterOnlyTitle; // chapter 1-အခန်း (၁) - နိဒါန်း .. ရွှေရောင်ကောင်းကင် ကမ္ဘာ
            document.getElementById('contentHeaderTitle').textContent = chapterOnlyTitle; // Chapter အစတွင် ပေါ်မည့် နာမည်
            document.getElementById('breadChapter').textContent = chapterOnlyTitle;
            document.getElementById('chapterContent').textContent = currentPost.content || currentPost.summary || 'စာဖတ်ရန် အကြောင်းအရာ မရှိသေးပါ။';

            // Back To Novel Link Logic
            const novelListBtn = document.getElementById('novelListBtn');
            const backToNovel = document.getElementById('backToNovel');
            const novelUrl = `novels.html?category=${category}&id=${currentId}`;
            
            novelListBtn.href = novelUrl;
            backToNovel.href = novelUrl;
            backToNovel.textContent = mainBookTitle;

            // Prev & Next Navigation Logic
            const currentIndex = keys.indexOf(currentId);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (currentIndex > 0) {
              prevBtn.href = `read.html?category=${category}&id=${keys[currentIndex - 1]}`;
              prevBtn.classList.remove('hidden');
            }
            if (currentIndex < keys.length - 1) {
              nextBtn.href = `read.html?category=${category}&id=${keys[currentIndex + 1]}`;
              nextBtn.classList.remove('hidden');
            }
          }
        }
      } catch (err) {
        console.error("Read Chapter Error:", err);
      }
    }
  </script>
</body>
</html>
