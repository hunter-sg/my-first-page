<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာဖတ်ရန် - Literature Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
    body { font-family: 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-[#1e1b4b] text-white min-h-screen flex flex-col select-none">

  <header class="bg-[#2e2a72] border-b border-[#3b358c] sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a id="backBtn" href="javascript:history.back()" class="text-amber-400 hover:text-amber-300 flex items-center gap-2 text-sm font-bold">
        <i class="fa-solid fa-arrow-left"></i> နောက်သို့
      </a>
      <span class="text-lg font-bold text-amber-400">စာပေဥယျာဉ်</span>
      <div class="w-16"></div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto p-4 md:p-6 my-4">
    <div id="loading" class="text-center py-20 text-gray-400">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-amber-400 mb-3"></i>
      <p>စာမူ ရယူနေပါသည်...</p>
    </div>

    <article id="readerContainer" class="hidden bg-[#24205a]/90 border border-[#3b358c] rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
      <div class="border-b border-[#3b358c]/60 pb-5 text-center">
        <h1 id="bookTitle" class="text-xl md:text-2xl font-bold text-amber-400 mb-2"></h1>
        <h2 id="chapterTitle" class="text-base md:text-lg font-medium text-amber-200 mb-3"></h2>
        
        <div class="flex items-center justify-center gap-4 text-xs text-gray-300">
          <span id="authorName" class="flex items-center gap-1"></span>
          <span>•</span>
          <span id="postDate" class="flex items-center gap-1"></span>
        </div>
      </div>

      <div id="storyContent" class="text-gray-100 text-base md:text-lg leading-relaxed whitespace-pre-line tracking-wide font-normal py-2">
      </div>

      <div class="border-t border-[#3b358c]/60 pt-6 flex items-center justify-between">
        <a id="chapterListLink" href="#" class="bg-[#18153d] hover:bg-[#2e2a72] border border-[#3b358c] text-amber-400 text-xs font-bold px-4 py-2.5 rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-list-ol"></i> အခန်းစဉ်များသို့
        </a>
      </div>
    </article>
  </main>

  <footer class="bg-[#2e2a72]/60 border-t border-[#3b358c] py-4 text-center text-xs text-gray-400 mt-auto">
    <p>© 2026 Literature Garden. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('bookId');
    const chapId = urlParams.get('chapId');

    const loadingEl = document.getElementById('loading');
    const readerContainer = document.getElementById('readerContainer');

    if (bookId && chapId) {
      get(ref(db, `novels/${bookId}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const book = snapshot.val();
          const chap = book.chapters ? book.chapters[chapId] : null;

          if (chap) {
            document.getElementById('bookTitle').textContent = book.title;
            document.getElementById('chapterTitle').textContent = chap.subTitle ? `${chap.chapterTitle} - ${chap.subTitle}` : chap.chapterTitle;
            document.getElementById('authorName').innerHTML = `<i class="fa-solid fa-pen-nib text-amber-400"></i> ${book.author || 'အမည်မသိ'}`;
            document.getElementById('postDate').innerHTML = `<i class="fa-regular fa-calendar"></i> ${chap.date || ''}`;
            document.getElementById('storyContent').textContent = chap.content || '';
            document.getElementById('chapterListLink').href = `bookdetail.html?id=${bookId}`;

            loadingEl.classList.add('hidden');
            readerContainer.classList.remove('hidden');
          } else {
            loadingEl.innerHTML = `<p class="text-rose-400">အခန်းကို မတွေ့ရှိပါ။</p>`;
          }
        } else {
          loadingEl.innerHTML = `<p class="text-rose-400">စာအုပ်ကို မတွေ့ရှိပါ။</p>`;
        }
      });
    } else {
      loadingEl.innerHTML = `<p class="text-rose-400">သတ်မှတ်ချက်များ မပြည့်စုံပါ။</p>`;
    }
  </script>
</body>
</html>
