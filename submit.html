<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာမူသစ် တင်ရန် - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header class="bg-indigo-900 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">စာပေဥယျာဉ် - စာမူတင်ရန်</h1>
      <a href="index.html" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded transition">
        <i class="fa-solid fa-house mr-1"></i> ပင်မစာမျက်နှာ
      </a>
    </div>
  </header>

  <!-- Form Container -->
  <main class="container mx-auto px-4 my-8 max-w-lg flex-grow">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <h2 class="text-base font-bold text-gray-800 border-b pb-2">စာမူသစ် ထည့်သွင်းပါ</h2>

      <form id="submitForm" class="space-y-4">
        <!-- Category Selection -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ကဏ္ဍ ရွေးချယ်ပါ</label>
          <select id="category" class="w-full border border-gray-200 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="knowledges">သုတရသ</option>
            <option value="novels">ဝတ္ထု</option>
            <option value="sports">အားကစား</option>
            <option value="poems">ကဗျာ</option>
          </select>
        </div>

        <!-- Title -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ခေါင်းစဉ်</label>
          <input type="text" id="title" required class="w-full border border-gray-200 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="ခေါင်းစဉ် ရေးပါ...">
        </div>

        <!-- Author -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ရေးသူ နာမည်</label>
          <input type="text" id="author" required class="w-full border border-gray-200 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="ရေးသူ နာမည် ရေးပါ...">
        </div>

        <!-- Image Input -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ပုံထည့်ရန် (ဓါတ်ပုံ/ကာဗာ)</label>
          <input type="file" id="imageInput" accept="image/*" class="w-full border border-gray-200 rounded-lg p-2 text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <!-- Content -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">စာမူ စာကိုယ်</label>
          <textarea id="content" rows="6" required class="w-full border border-gray-200 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="စာမူ ရေးသားပါ..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-lg text-xs transition flex items-center justify-center gap-2">
          <span>စာမူ တင်မည်</span>
        </button>
      </form>
    </div>
  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const submitForm = document.getElementById('submitForm');
    const imageInput = document.getElementById('imageInput');
    const submitBtn = document.getElementById('submitBtn');

    // Convert Image File to Base64 String
    const convertBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    };

    submitForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ခဏစောင့်ပါ...`;

      const category = document.getElementById('category').value;
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const content = document.getElementById('content').value;
      
      let imageUrl = "";

      // Handle Image File if Uploaded
      if (imageInput.files && imageInput.files[0]) {
        try {
          imageUrl = await convertBase64(imageInput.files[0]);
        } catch (err) {
          console.error("Image processing error:", err);
        }
      }

      // Save to Firebase Database
      try {
        await push(ref(database, category), {
          title: title,
          author: author,
          content: content,
          image: imageUrl, // Base64 Image
          date: new Date().toLocaleDateString('en-GB'),
          views: 0,
          likes: 0
        });

        alert("စာမူ အောင်မြင်စွာ တင်ပြီးပါပြီ!");
        submitForm.reset();
      } catch (error) {
        alert("စာမူ တင်၍ မအောင်မြင်ပါ: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>စာမူ တင်မည်</span>`;
      }
    });
  </script>
</body>
</html>
