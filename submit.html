<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Novel Chapter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 w-full max-w-2xl shadow-xl">
    <h2 class="text-xl font-bold text-amber-400 mb-6 flex items-center gap-2">
      <i class="fa-solid fa-pen-nib"></i> စာမူသစ် / အခန်းသစ် တင်ရန်
    </h2>

    <form id="uploadForm" class="space-y-5">
      
      <!-- စာမူခေါင်းစဉ် -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          စာမူခေါင်းစဉ် (Novel Title) <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="novelTitle" placeholder="ဥပမာ - ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်" required class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition">
      </div>

      <!-- Chapter Number & Sub-title -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            အခန်း / Chapter <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="chapterTitle" placeholder="ဥပမာ - အခန်း (၁) / Chapter 1" required class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">အခန်းခေါင်းစဉ် (Sub-title)</label>
          <input type="text" id="chapterSubtitle" placeholder="ဥပမာ - နိဒါန်း" class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition">
        </div>
      </div>

      <!-- Category & Author -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            ကဏ္ဍ (Category) <span class="text-rose-500">*</span>
          </label>
          <select id="category" required class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition text-slate-300">
            <option value="newnovels">ဝတ္ထု</option>
            <option value="thuta">သုတရသ</option>
            <option value="sports">အားကစား</option>
            <option value="poems">ကဗျာ</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            စာရေးသူ / ဘာသာပြန်သူ <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="author" placeholder="Translate by Hunter" required class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition">
        </div>
      </div>

      <!-- Cover Image (ဓါတ်ပုံ ရွေးပါ) -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Cover Image (ဓါတ်ပုံ ရွေးပါ)</label>
        <input type="file" id="coverImage" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer bg-slate-950 border border-slate-700 rounded-xl p-1">
      </div>

      <!-- Summary -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">ဝတ္ထု အကျဉ်းချုပ် (Summary)</label>
        <textarea id="summary" rows="3" placeholder="ဝတ္ထု၏ အကြောင်းအရာ အကျဉ်းချုပ်..." class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl p-3 text-sm outline-none transition"></textarea>
      </div>

      <!-- Content -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          အခန်း စာမူအပြည့်အစုံ <span class="text-rose-500">*</span>
        </label>
        <textarea id="content" rows="6" placeholder="ဤအခန်း၏ ဝတ္ထု စာသားများကို ရေးပါ..." required class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl p-3 text-sm outline-none transition"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/10 mt-6">
        <i class="fa-solid fa-cloud-arrow-up"></i> စာမူတင်မည်
      </button>

    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Free ImgBB API Key
    const IMGBB_API_KEY = "6d207e02198a847aa98d0a2a901485a5";

    // ImgBB သို့ ပုံ တင်ပေးမည့် Function
    async function uploadImageToImgBB(file) {
      const formData = new FormData();
      formData.append("image", file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      if (data.success) {
        return data.data.url; // ပုံ၏ Direct URL ကို ပြန်ပေးမည်
      } else {
        throw new Error("Image Upload Failed");
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ပုံနှင့် စာမူ တင်နေပါသည်...`;

      const category = document.getElementById('category').value;
      const fileInput = document.getElementById('coverImage');
      let imageUrl = "";

      try {
        // ပုံ ရွေးထားပါက ImgBB ထဲသို့ အရင် တင်မည်
        if (fileInput.files.length > 0) {
          imageUrl = await uploadImageToImgBB(fileInput.files[0]);
        }

        const rawTitle = document.getElementById('novelTitle').value.trim();

        const postData = {
          title: rawTitle,
          bookTitle: rawTitle,
          chapter: document.getElementById('chapterTitle').value.trim(),
          subTitle: document.getElementById('chapterSubtitle').value.trim(),
          author: document.getElementById('author').value.trim(),
          category: category,
          summary: document.getElementById('summary').value.trim(),
          content: document.getElementById('content').value.trim(),
          coverImage: imageUrl, // ပုံ၏ Online URL ကို သိမ်းဆည်းခြင်း
          timestamp: Date.now()
        };

        const categoryRef = ref(db, category);
        const newPostRef = push(categoryRef);
        await set(newPostRef, postData);

        alert('စာမူ နှင့် ပုံ အောင်မြင်စွာ တင်ပြီးပါပြီ။');
        window.location.href = 'index.html';

      } catch (err) {
        console.error("Upload Error:", err);
        alert('စာမူတင်ရာတွင် အမှားအယွင်းရှိနေပါသည်: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> စာမူတင်မည်`;
      }
    });
  </script>
</body>
</html>
