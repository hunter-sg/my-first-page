<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာမူတင်ရန် - Literature Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-indigo-950 text-white min-h-screen flex flex-col font-sans">

  <!-- Header Section -->
  <header class="bg-indigo-900 border-b border-indigo-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-full border-2 border-amber-400 overflow-hidden flex items-center justify-center bg-indigo-950">
          <i class="fa-solid fa-book-open text-amber-400 text-lg"></i>
        </div>
        <span class="text-xl font-bold text-amber-400 tracking-wide">စာပေဥယျာဉ်</span>
      </a>

      <!-- Right Controls (Clock & Menu Button) -->
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-950/60 border border-indigo-800 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex flex-col items-center justify-center leading-tight">
          <span id="timeDisplay" class="font-bold text-amber-300">00:00:00</span>
          <span id="dateDisplay" class="font-medium">00/00/0000</span>
        </div>

        <button id="menuToggleBtn" class="text-white text-xl p-2 focus:outline-none hover:text-amber-400 transition">
          <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
      </div>
    </div>

    <!-- Dropdown Navigation Links -->
    <nav id="menuList" class="hidden bg-indigo-950/95 border-t border-indigo-800/80 px-4 py-4 space-y-3">
      <a href="index.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-indigo-900/50">ပင်မ</a>
      <a href="knowledges.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-indigo-900/50">သုတရသ</a>
      <a href="newnovels.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-indigo-900/50">ဝတ္ထု</a>
      <a href="sports.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-indigo-900/50">အားကစား</a>
      <a href="poems.html" class="block px-3 py-2 text-white hover:text-amber-400 rounded hover:bg-indigo-900/50">ကဗျာ</a>
      <a href="submit.html" class="block bg-amber-500 text-slate-950 font-bold text-center px-4 py-2 rounded-lg transition mt-2">
        <i class="fa-solid fa-pen-to-square mr-1"></i> စာမူတင်ရန်
      </a>
    </nav>
  </header>

  <!-- Main Content Form -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6">
    <div class="bg-indigo-900/40 border border-indigo-800/80 backdrop-blur rounded-2xl p-6 md:p-8 shadow-xl">
      
      <div class="flex items-center gap-3 border-b border-indigo-800/80 pb-4 mb-6">
        <i class="fa-solid fa-pen-to-square text-amber-400 text-2xl"></i>
        <h1 class="text-xl md:text-2xl font-bold text-amber-400">စာမူသစ် / အခန်းသစ် တင်ရန်</h1>
      </div>

      <form id="postForm" class="space-y-5">
        <!-- စာမူခေါင်းစဉ် (Novel Title) -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">
            စာမူခေါင်းစဉ် (Novel Title) <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="postTitle" required placeholder="ဥပမာ - ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်" class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition">
        </div>

        <!-- Chapter & Sub-title -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">
              အခန်း / Chapter <span class="text-rose-500">*</span>
            </label>
            <input type="text" id="postChapter" required placeholder="ဥပမာ - အခန်း (၁) / Chapter 1" class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">အခန်းခေါင်းစဉ် (Sub-title)</label>
            <input type="text" id="postSubtitle" placeholder="ဥပမာ - နိဒါန်း" class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition">
          </div>
        </div>

        <!-- Category & Author -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">
              ကဏ္ဍ (Category) <span class="text-rose-500">*</span>
            </label>
            <select id="postCategory" class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition">
              <option value="newnovels">ဝတ္ထု</option>
              <option value="knowledges">သုတရသ</option>
              <option value="sports">အားကစား</option>
              <option value="poems">ကဗျာ</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">
              စာရေးသူ / ဘာသာပြန်သူ <span class="text-rose-500">*</span>
            </label>
            <input type="text" id="postAuthor" required placeholder="Translate by Hunter" class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition">
          </div>
        </div>

        <!-- Cover Image -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Cover Image (ဓါတ်ပုံ ရွေးပါ)</label>
          <input type="file" id="postImageFile" accept="image/*" class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2 text-sm text-white file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 focus:outline-none transition">
        </div>

        <!-- Summary (ဝတ္ထု အကျဉ်းချုပ်) -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">ဝတ္ထု အကျဉ်းချုပ် (Summary)</label>
          <textarea id="postSummary" rows="3" placeholder="ဝတ္ထု၏ အကြောင်းအရာ အကျဉ်းချုပ်..." class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition leading-relaxed"></textarea>
        </div>

        <!-- Content -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">
            အခန်း စာမူအပြည့်အစုံ <span class="text-rose-500">*</span>
          </label>
          <textarea id="postContent" rows="6" required placeholder="ဤအခန်း၏ ဝတ္ထု စာသားများကို ရေးပါ..." class="w-full bg-indigo-950 border border-indigo-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 transition leading-relaxed"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition flex items-center justify-center gap-2 shadow-lg">
          <i class="fa-solid fa-paper-plane"></i> စာမူ တင်မည်
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-indigo-900/60 border-t border-indigo-800 py-4 text-center text-xs text-gray-400 mt-8">
    <p>© 2026 Literature Garden. All rights reserved.</p>
  </footer>

  <!-- Firebase v10 Modular Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Project Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Live Clock Function
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      const timeEl = document.getElementById('timeDisplay');
      const dateEl = document.getElementById('dateDisplay');

      if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;
      if (dateEl) dateEl.textContent = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Navigation Toggle Logic
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const menuList = document.getElementById('menuList');
    const menuIcon = document.getElementById('menuIcon');

    if (menuToggleBtn && menuList) {
      menuToggleBtn.addEventListener('click', () => {
        menuList.classList.toggle('hidden');
        if (menuIcon) {
          menuIcon.classList.toggle('fa-bars');
          menuIcon.classList.toggle('fa-xmark');
        }
      });
    }

    // Fixed Image Compression & Base64 Converter
    const convertAndCompressBase64 = (file, maxWidth = 400, quality = 0.6) => {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (error) => reject(error);
        };
        fileReader.onerror = (error) => reject(error);
      });
    };

    // Form Submit Handler
    const postForm = document.getElementById('postForm');
    const submitBtn = document.getElementById('submitBtn');

    if (postForm) {
      postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> စာမူ သိမ်းဆည်းနေသည်...';

        try {
          const fileInput = document.getElementById('postImageFile');
          let imageUrl = '';

          // ပုံရွေးထားပါက Compress လုပ်ပြီး Base64 ပြောင်းမည်
          if (fileInput && fileInput.files[0]) {
            imageUrl = await convertAndCompressBase64(fileInput.files[0]);
          }

          // Database သို့ Data ပို့ခြင်း
          const category = document.getElementById('postCategory').value;
          const rawTitle = document.getElementById('postTitle').value.trim();

          const newPost = {
            title: rawTitle,
            bookTitle: rawTitle,
            chapter: document.getElementById('postChapter').value.trim(),
            subTitle: document.getElementById('postSubtitle').value.trim(),
            author: document.getElementById('postAuthor').value.trim(),
            category: category,
            summary: document.getElementById('postSummary').value.trim(),
            content: document.getElementById('postContent').value.trim(),
            image: imageUrl,
            coverImage: imageUrl,
            date: new Date().toLocaleDateString('en-GB'),
            likes: 0,
            views: 0,
            createdAt: Date.now()
          };

          await push(ref(db, category), newPost);
          alert('စာမူ အောင်မြင်စွာ တင်ပြီးပါပြီ!');
          window.location.href = 'index.html';

        } catch (err) {
          console.error("Error submitting post: ", err);
          alert('စာမူ တင်၍ မရပါ: ' + err.message);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> စာမူ တင်မည်';
        }
      });
    }
  </script>
</body>
</html>
