<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Novel Chapter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 w-full max-w-2xl shadow-xl">
    <h2 class="text-xl font-bold text-amber-400 mb-6 flex items-center gap-2">
      <i class="fa-solid fa-pen-nib"></i> စာမူသစ် / အခန်းသစ် တင်ရန်
    </h2>

    <form id="uploadForm" class="space-y-5">
      
      <!-- စာမူခေါင်းစဉ် (Novel Title) -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          စာမူခေါင်းစဉ် (Novel Title) <span class="text-rose-500">*</span>
        </label>
        <input 
          type="text" 
          id="novelTitle" 
          placeholder="ဥပမာ - ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်" 
          required 
          class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition"
        >
      </div>

      <!-- Chapter Number / Title (သီးခြား ခွဲထုတ်ထားသည့် Input Field) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            အခန်း / Chapter <span class="text-rose-500">*</span>
          </label>
          <input 
            type="text" 
            id="chapterTitle" 
            placeholder="ဥပမာ - Chapter 1 (သို့) အခန်း (၁)" 
            required 
            class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            အခန်းခေါင်းစဉ် (Sub-title - Optional)
          </label>
          <input 
            type="text" 
            id="chapterSubtitle" 
            placeholder="ဥပမာ - ရွှေရောင်ကောင်းကင် ကမ္ဘာ" 
            class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition"
          >
        </div>
      </div>

      <!-- Category & Author -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            ကဏ္ဍ (Category) <span class="text-rose-500">*</span>
          </label>
          <select 
            id="category" 
            required 
            class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition text-slate-300"
          >
            <option value="thuta">သုတရသ</option>
            <option value="newnovels">ဝတ္ထု</option>
            <option value="sports">အားကစား</option>
            <option value="poems">ကဗျာ</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            စာရေးသူ / ဘာသာပြန်သူ နာမည် <span class="text-rose-500">*</span>
          </label>
          <input 
            type="text" 
            id="author" 
            placeholder="translate by Hunter" 
            required 
            class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm outline-none transition"
          >
        </div>
      </div>

      <!-- Summary -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          ဝတ္ထု အကျဉ်းချုပ် (Summary) <span class="text-amber-500 text-[10px]">(ဝတ္ထု ပထမဆုံး အခန်းတင်ပါက ရေးပေးရန်)</span>
        </label>
        <textarea 
          id="summary" 
          rows="3" 
          placeholder="ဝတ္ထု၏ အကြောင်းအရာ အကျဉ်းချုပ်ကို ရေးပါ..." 
          class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl p-3 text-sm outline-none transition"
        ></textarea>
      </div>

      <!-- Content / Chapter Story Details -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          အခန်း စာမူအပြည့်အစုံ (Chapter Content) <span class="text-rose-500">*</span>
        </label>
        <textarea 
          id="content" 
          rows="6" 
          placeholder="ဤအခန်း၏ ဝတ္ထု စာသားများကို ရေးပါ..." 
          required 
          class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-xl p-3 text-sm outline-none transition"
        ></textarea>
      </div>

      <!-- Cover Image -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Cover Image ရွေးချယ်ရန်</label>
        <input 
          type="file" 
          id="coverImage" 
          accept="image/*"
          class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer bg-slate-950 border border-slate-700 rounded-xl p-1"
        >
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/10 mt-6"
      >
        <i class="fa-solid fa-cloud-arrow-up"></i> စာမူတင်မည်
      </button>

    </form>
  </div>

  <!-- Firebase Script Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> တင်နေပါသည်...`;

      const novelTitle = document.getElementById('novelTitle').value.trim();
      const chapterTitle = document.getElementById('chapterTitle').value.trim();
      const chapterSubtitle = document.getElementById('chapterSubtitle').value.trim();
      const category = document.getElementById('category').value;
      const author = document.getElementById('author').value.trim();
      const summary = document.getElementById('summary').value.trim();
      const content = document.getElementById('content').value.trim();

      // ခေါင်းစဉ်နှစ်ခုပေါင်းစပ်ခြင်း (ဥပမာ - ကောင်းကင်ဘုံကိုဓါးပြတိုက်မယ်: Chapter 1 - နိဒါန်း)
      let fullDisplayTitle = novelTitle;
      if (chapterTitle) fullDisplayTitle += `: ${chapterTitle}`;
      if (chapterSubtitle) fullDisplayTitle += ` - ${chapterSubtitle}`;

      const postData = {
        bookTitle: novelTitle,          // ဝတ္ထုအမည် သီးသန့်
        chapter: chapterTitle,           // Chapter နံပါတ် သီးသန့်
        subTitle: chapterSubtitle,       // အခန်းခေါင်းစဉ် သီးသန့်
        title: fullDisplayTitle,         // အပြည့်အစုံ
        author: author,
        category: category,
        summary: summary,
        content: content,
        timestamp: Date.now()
      };

      try {
        const categoryRef = ref(db, category);
        const newPostRef = push(categoryRef);
        await set(newPostRef, postData);

        alert('စာမူ အောင်မြင်စွာ တင်ပြီးပါပြီ။');
        document.getElementById('uploadForm').reset();
      } catch (err) {
        console.error("Upload Error:", err);
        alert('စာမူတင်ရာတွင် အမှားအယွင်းရှိနေပါသည်။');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> စာမူတင်မည်`;
      }
    });
  </script>
</body>
</html>
