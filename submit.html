<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>စာမူသစ်တင်ရန် - စာပေဥယျာဉ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Padauk', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <nav class="bg-indigo-900 text-white py-1.5 px-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex flex-wrap justify-between items-center gap-2">
      <h1 class="text-lg font-bold tracking-wide">စာပေဥယျာဉ်</h1>
      <div class="flex items-center space-x-2.5 text-xs flex-wrap">
        <a href="index.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာ
        </a>
        <a href="knowledges.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-book-open"></i> အထွေထွေသုတရသများ
        </a>
        <a href="newnovels.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-book"></i> ဝတ္ထုတို/ရှည်များ
        </a>
        <a href="sports.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-futbol"></i> နိုင်ငံတကာ အားကစားသတင်းများ
        </a>
        <a href="poems.html" class="hover:text-amber-400 transition flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-feather"></i> ကဗျာများ
        </a>
        <a href="submit.html" class="text-amber-400 font-bold flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-plus"></i> စာမူသစ်တင်ရန်
        </a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto my-8 px-4 flex-grow max-w-2xl">
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-gray-100">
      
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-indigo-900">
          <i class="fa-solid fa-pen-nib text-amber-500 mr-2"></i>စာမူသစ် တင်သွင်းရန်
        </h2>
        <p class="text-gray-500 text-xs mt-1">သင်၏ ဆောင်းပါး၊ သတင်း သို့မဟုတ် ဝတ္ထုများကို ဤနေရာမှ တင်နိုင်ပါသည်။</p>
      </div>

      <form id="submitForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">ကဏ္ဍ ရွေးချယ်ရန်</label>
          <select id="category" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="sports">နိုင်ငံတကာ အားကစားသတင်းများ</option>
            <option value="knowledges">အထွေထွေသုတရသများ</option>
            <option value="newnovels">ဝတ္ထုတို/ရှည်များ</option>
            <option value="poems">ကဗျာများ</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">ခေါင်းစဉ်</label>
          <input type="text" id="title" required placeholder="ခေါင်းစဉ် ထည့်ပါ..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">ရေးသားသူ အမည်</label>
          <input type="text" id="author" required placeholder="သင့်အမည် (သို့) ကလောင်အမည်..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">ပုံ တင်ရန် (စက်ထဲမှ ရွေးချယ်ပါ)</label>
          <input type="file" id="imageFile" accept="image/*" class="w-full px-3 py-1.5 text-xs border border-gray-300 rounded-lg focus:outline-none file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <p class="text-[10px] text-gray-400 mt-1">ပုံမထည့်လိုပါက ကျော်သွားနိုင်ပါသည်။</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">အကြောင်းအရာ အပြည့်အစုံ</label>
          <textarea id="content" rows="6" required placeholder="အကြောင်းအရာများကို ရေးသားပါ..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-lg transition shadow-md text-sm flex justify-center items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> စာမူ တင်မည်
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-indigo-950 text-gray-400 py-4 text-center text-xs mt-auto">
    <p>© 2026 စာပေဥယျာဉ်။ မူပိုင်ခွင့်များအားလုံး လက်ဝယ်ရှိသည်။</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBamZnSGBuILNFRyTUo_9e4xPpF01Fk9ww",
      authDomain: "my-new-projects-e2d79.firebaseapp.com",
      databaseURL: "https://my-new-projects-e2d79-default-rtdb.firebaseio.com",
      projectId: "my-new-projects-e2d79",
      storageBucket: "my-new-projects-e2d79.firebasestorage.app",
      messagingSenderId: "544924460381",
      appId: "1:544924460381:web:711d1427a2caaaaaf6b4b4"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const storage = getStorage(app);

    document.getElementById('submitForm').onsubmit = async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> တင်နေပါသည်...`;

      const category = document.getElementById('category').value;
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const content = document.getElementById('content').value;
      const imageFile = document.getElementById('imageFile').files[0];

      let imageUrl = "";

      try {
        // ပုံရွေးထားလျှင် Firebase Storage သို့ တိုက်ရိုက် Upload တင်မည်
        if (imageFile) {
          const uniqueName = Date.now() + '_' + imageFile.name;
          const fileRef = storageRef(storage, `images/${uniqueName}`);
          const snapshot = await uploadBytes(fileRef, imageFile);
          imageUrl = await getDownloadURL(snapshot.ref);
        }

        // Database ထဲသို့ Data များ သိမ်းမည်
        await push(dbRef(database, category), {
          title: title,
          author: author,
          content: content,
          image: imageUrl,
          date: new Date().toLocaleDateString('my-MM'),
          views: 0,
          likes: 0
        });

        alert("စာမူ တင်သွင်းခြင်း အောင်မြင်ပါသည်။");
        window.location.href = category + ".html";

      } catch (error) {
        console.error(error);
        alert("တင်သွင်းရာတွင် အမှားအယွင်း ရှိခဲ့ပါသည်။ ကျေးဇူးပြု၍ ပြန်ကြိုးစားပါ။");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> စာမူ တင်မည်`;
      }
    };
  </script>
</body>
</html>
